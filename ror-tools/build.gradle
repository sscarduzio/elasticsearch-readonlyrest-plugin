buildscript {
    ext {
        esVersion = project.properties['esVersion'] ?: "unknown"
    }
}

plugins {
    id "readonlyrest.base-common-conventions"

    id "com.github.maiflai.scalatest"           version "0.33"
    id "com.gradleup.shadow"                    version "9.3.0"
}

repositories {
    maven { url 'https://repo.gradle.org/gradle/libs-releases' }
}

sourceSets {
    test {
        resources {
            srcDirs += [
                    "$rootDir/tests-utils/src/main/resources"
            ]
        }
    }
}

test {
    // Run tests with Java 21 (required by Gradle Tooling API used in tests, matches CI environment)
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(17) }

    systemProperty "project.dir", rootProject.projectDir
    enabled = project.hasProperty('esModule')
    if (enabled) {
        def module = project.properties['esModule']
        systemProperty "esModule", module
        def explicitEsVersion = project.gradle.startParameter.projectProperties['esVersion']
        if (explicitEsVersion != null) { systemProperty "esVersion", explicitEsVersion }
        tags {
            exclude 'tech.beshu.tags.ExcludeESModule.' + module
            exclude 'tech.beshu.tags.IgnoreOnWindows'
        }
        suite 'tech.beshu.ror.tools.*'
    }
    outputs.upToDateWhen { false }
    maxParallelForks = 1
}

configurations {
    shadowRuntime {
        extendsFrom runtimeClasspath
    }
}

dependencies {
    implementation project(path: ':ror-tools-core')
    implementation group: 'com.github.scopt',              name: 'scopt_3',                       version: '4.1.0'

    testImplementation(project(':tests-utils'))
    testImplementation group:  'ch.qos.logback',        name: 'logback-classic',  version: '1.5.22'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(11)
    }
}

tasks.withType(ScalaCompile).configureEach {
    scalaCompileOptions.additionalParameters = ["-feature", "-Xfatal-warnings"]
}

shadowJar {
    minimize()
    manifest {
        attributes 'Main-Class': 'tech.beshu.ror.tools.RorToolsApp'
    }
    archiveFileName = "ror-tools.${getArchiveExtension().get()}"
    configurations = [project.configurations.shadowRuntime]
}

// Configure Auto Relocation
import com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar

tasks.named('shadowJar', ShadowJar) {
    enableAutoRelocation = true
    relocationPrefix = "tech.beshu.ror.tools"
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
import javax.inject.Inject
import org.gradle.process.ExecOperations
import tech.beshu.ror.gradle.utils.EsDistribution
import tech.beshu.ror.gradle.utils.ArtifactGroups
import tech.beshu.ror.gradle.utils.EsLibsMirror
import tech.beshu.ror.gradle.utils.LibsStore
import tech.beshu.ror.gradle.utils.MavenPoms

// Publishes the ES jars and their POMs to the libs store, for ES versions Elastic has released but not yet
// published to Maven Central. The es*x modules resolve those versions from the store until Central catches up
// (see the repository in readonlyrest.plugin-common-conventions).
//
// EsLibsMirror decides what to publish and what the POMs declare; the tasks below do the I/O around it: copying
// jars out of the unpacked distribution, writing the generated POMs and uploading both.

// Same store the es*x modules RESOLVE from (see the repository in readonlyrest.plugin-common-conventions):
// LibsStore is where its coordinates and their defaults are defined, once, for both sides.
def libsStoreEnvironment = LibsStore.fromEnv().uploadEnvironment()

def targetEsVersion = esVersion.toString()
def buildDirPath = { layout.buildDirectory.get().asFile.toPath() }
def fileInBuildDir = { String name -> buildDirPath().resolve(name).toFile() }

def mirrorPlanCache = [:]

def mirrorPlan = {
    mirrorPlanCache.computeIfAbsent('plan') {
        def distribution = EsDistribution.scan(EsDistribution.distributionDirIn(buildDirPath(), targetEsVersion))
        def plan = EsLibsMirror.planFor(distribution, ArtifactGroups.ofEsRelease(targetEsVersion))
        project.logger.lifecycle("Publishing ${plan.jars().size()} jars and ${plan.poms().size()} POMs, read from the ES ${targetEsVersion} distribution")
        plan
    }
}

tasks.register('uploadArtifactsFromEsBinaries') {
    dependsOn generatePomsFromEsBinaries
    def execOperations = project.objects.newInstance(InjectedExecOps).execOperations
    doLast {
        def plan = mirrorPlan()
        // A coordinate's jar and POM share a directory, and upload-files-to-s3.sh takes several files for one
        // destination, so they go up in a single call.
        plan.jars().each { jar ->
            def pom = plan.pomFor(jar).orElse(null)
            def filesToUpload = [fileInBuildDir(jar.fileName()).path]
            if (pom != null) {
                filesToUpload += fileInBuildDir(pom.fileName()).path
            }
            def destination = jar.coordinate().repositoryPath(jar.version())
            execOperations.exec {
                environment libsStoreEnvironment
                commandLine(["${rootDir}/ci/upload-files-to-s3.sh".toString()] + filesToUpload + [destination])
            }
        }
    }
}

tasks.register('generatePomsFromEsBinaries') {
    dependsOn getArtifactsFromEsBinaries
    doLast {
        mirrorPlan().poms().each { pom ->
            def pomFile = fileInBuildDir(pom.fileName())
            pomFile.text = MavenPoms.render(pom.coordinate(), pom.version(), pom.dependencies())
            project.logger.info("Generated ${pomFile.path}")
        }
    }
}

tasks.register('getArtifactsFromEsBinaries') {
    dependsOn downloadEsBinaries
    doLast {
        def destPath = layout.buildDirectory
        mirrorPlan().jars().each { jar ->
            project.logger.info("Copying ${jar.file()} to ${destPath.get().asFile.path} ...")
            copy {
                from jar.file().toFile()
                into destPath
            }
        }
    }
}

tasks.register('downloadEsBinaries') {
    doLast {
        def esTar = EsDistribution.downloadArchiveTo(buildDirPath(), targetEsVersion).toFile()
        def esDir = EsDistribution.unpackDirIn(buildDirPath(), targetEsVersion).toFile()
        project.logger.info("Extracting ${esTar.path} to ${esDir.path} ...")
        copy {
            from tarTree(esTar)
            into esDir
        }
    }
}

// ExecOperations is injected into constructors, and a task declared in a script has none of ours. This
// interface carries the injection, so the upload runs exec() without reaching for Project at execution time.
interface InjectedExecOps {
    @Inject ExecOperations getExecOperations()
}
