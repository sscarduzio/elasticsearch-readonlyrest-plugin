buildscript {
    ext {
        esVersion = project.properties['esVersion'] ?: "unknown"
    }
}

plugins {
    id "readonlyrest.base-common-conventions"

    id "com.github.maiflai.scalatest"           version "0.33"
    id "com.gradleup.shadow"                    version "9.3.0"
}

repositories {
    maven { url 'https://repo.gradle.org/gradle/libs-releases' }
    maven { url 'https://jitpack.io' }
}

sourceSets {
    test {
        resources {
            srcDirs += [
                    "$rootDir/tests-utils/src/main/resources"
            ]
        }
    }
}

test {
    // Run tests with Java 21 (required by Gradle Tooling API used in tests, matches CI environment)
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(17) }

    systemProperty "project.dir", rootProject.projectDir
    enabled = project.hasProperty('esModule')
    if (enabled) {
        def module = project.properties['esModule']
        systemProperty "esModule", module
        def explicitEsVersion = project.gradle.startParameter.projectProperties['esVersion']
        if (explicitEsVersion != null) { systemProperty "esVersion", explicitEsVersion }
        tags {
            exclude 'tech.beshu.tags.ExcludeESModule.' + module
            exclude 'tech.beshu.tags.IgnoreOnWindows'
        }
        suite 'tech.beshu.ror.tools.*'
    }
    outputs.upToDateWhen { false }
    maxParallelForks = 1
}

configurations {
    shadowRuntime {
        extendsFrom runtimeClasspath
    }
}

dependencies {
    implementation project(path: ':ror-tools-core')
    implementation group: 'com.github.scopt',              name: 'scopt_3',                       version: '4.1.0'

    testImplementation(project(':tests-utils'))
    testImplementation group:  'ch.qos.logback',        name: 'logback-classic',  version: '1.5.22'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(11)
    }
}

compileScala {
    options.compilerArgs.addAll(
            "-feature",
            "-Xfatal-warnings",
            "-Wunused:implicits",
            "-Wunused:imports",
            "-Wunused:explicits",
            "-Wunused:strict-no-implicit-warn",
            "-Wunused:locals",
            "-Wunused:params",
            "-Wunused:privates",
            "-Wunused:nowarn",
    )
}

tasks.withType(ScalaCompile).configureEach {
    scalaCompileOptions.additionalParameters = ["-feature", "-Xfatal-warnings"]
}

shadowJar {
    minimize()
    manifest {
        attributes 'Main-Class': 'tech.beshu.ror.tools.RorToolsApp'
    }
    archiveFileName = "ror-tools.${getArchiveExtension().get()}"
    configurations = [project.configurations.shadowRuntime]
}

// Configure Auto Relocation
import com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar

tasks.named('shadowJar', ShadowJar) {
    enableAutoRelocation = true
    relocationPrefix = "tech.beshu.ror.tools"
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
import javax.inject.Inject
import org.gradle.process.ExecOperations
import tech.beshu.ror.gradle.utils.EsDistribution
import tech.beshu.ror.gradle.utils.EsLibsMirror
import tech.beshu.ror.gradle.utils.MavenPoms

// ES jars reach Maven Central some time after a release, but ROR ships support for a new ES version on day
// one. Until Central catches up, the es*x modules resolve them from our libs store, which is declared as a
// fallback repository in readonlyrest.plugin-common-conventions. That store serves plain files, so a jar
// uploaded on its own carries no dependency information at all - which is why we generate and upload the
// POMs Central would have served too. This keeps version-specific dependency declarations out of the es*x
// build scripts, and the generated POMs stop being used the moment Elastic publishes the version to Central,
// because Central is declared first and therefore answers first.
//
// What to mirror and what the POMs say is worked out by EsLibsMirror (unit-tested in build-base); everything
// below is the I/O around it - fetching Elastic's published metadata, copying jars out of the extracted
// distribution, writing the POMs and uploading the lot.

def mavenCentralUrl = 'https://repo1.maven.org/maven2'

// The only fixed part: the coordinates the es*x modules declare, which are therefore the ones that need
// metadata in the store to resolve the way they do when Central serves them.
def esCoordinatesToMirror = [
        new MavenPoms.Coordinate('org.elasticsearch', 'elasticsearch'),
        new MavenPoms.Coordinate('org.elasticsearch.plugin', 'transport-netty4'),
        new MavenPoms.Coordinate('org.elasticsearch.client', 'elasticsearch-rest-client'),
]

def esExtractedDir = {
    new File(layout.buildDirectory.asFile.get(), "es-${esVersion}/elasticsearch-${esVersion}").toPath()
}
def fileInBuildDir = { String name -> new File(layout.buildDirectory.get().asFile, name) }
def destinationPathOf = { coordinate -> "${coordinate.repositoryPath()}/${esVersion}/".toString() }
def jarFileNameOf = { jar -> "${jar.coordinate().artifactId()}-${jar.version()}.jar".toString() }
def pomFileNameOf = { pom -> "${pom.coordinate().artifactId()}-${pom.version()}.pom".toString() }

def publishedEsVersions = {
    def metadataUrl = "${mavenCentralUrl}/org/elasticsearch/elasticsearch/maven-metadata.xml"
    new groovy.xml.XmlSlurper(false, false).parse(metadataUrl).versioning.versions.version.collect { it.text() }
}

def referenceDependenciesOf = { coordinate, String referenceVersion ->
    def pomUrl = "${mavenCentralUrl}/${coordinate.repositoryPath()}/${referenceVersion}/${coordinate.artifactId()}-${referenceVersion}.pom"
    project.logger.info("Reading dependencies of ${coordinate.artifactId()} from ${pomUrl} ...")
    MavenPoms.parseDependencies(new URL(pomUrl).getText('UTF-8'))
}

def mirrorPlanCache = [:]

def mirrorPlan = {
    mirrorPlanCache.computeIfAbsent('plan') {
        def referenceVersion = EsLibsMirror.referenceVersion(publishedEsVersions(), esVersion.toString())
        project.logger.lifecycle("Shaping the ES ${esVersion} POMs after the ones published for ${referenceVersion}")
        def referenceDependencies = esCoordinatesToMirror
                .collectEntries { coordinate -> [(coordinate): referenceDependenciesOf(coordinate, referenceVersion)] }
        EsLibsMirror.plan(EsDistribution.scan(esExtractedDir()), esVersion.toString(), referenceVersion, referenceDependencies)
    }
}

tasks.register('getArtifactsFromEsBinaries') {
    dependsOn downloadEsBinaries
    doLast {
        def destPath = layout.buildDirectory
        mirrorPlan().jars().each { jar ->
            project.logger.info("Copying ${jar.file()} to ${destPath.get().asFile.path} ...")
            copy {
                from jar.file().toFile()
                into destPath
            }
        }
    }
}

tasks.register('generatePomsFromEsBinaries') {
    dependsOn getArtifactsFromEsBinaries
    doLast {
        mirrorPlan().poms().each { pom ->
            def pomFile = fileInBuildDir(pomFileNameOf(pom))
            pomFile.text = MavenPoms.render(pom.coordinate(), pom.version(), pom.dependencies())
            project.logger.info("Generated ${pomFile.path}")
        }
    }
}

interface InjectedExecOps {
    @Inject ExecOperations getExecOperations()
}

def libsStoreEnvironment = [
        'ROR_S3_TARGET_STORE'             : 'LIBS',
        'ROR_LIBS_STORE_ENDPOINT_URL'     : System.getenv('ROR_LIBS_STORE_ENDPOINT_URL') ?: 'https://dgp.serve.beshu.tech',
        'ROR_LIBS_STORE_ACCESS_KEY_ID'    : System.getenv('ROR_LIBS_STORE_ACCESS_KEY_ID') ?: '',
        'ROR_LIBS_STORE_ACCESS_KEY_SECRET': System.getenv('ROR_LIBS_STORE_ACCESS_KEY_SECRET') ?: '',
        'ROR_LIBS_STORE_BUCKET'           : System.getenv('ROR_LIBS_STORE_BUCKET') ?: 'beshu',
        'ROR_LIBS_STORE_REGION'           : System.getenv('ROR_LIBS_STORE_REGION') ?: 'us-east-1',
        'ROR_LIBS_STORE_PATH_PREFIX'      : System.getenv('ROR_LIBS_STORE_PATH_PREFIX') ?: 'ror/libs',
]

tasks.register('uploadArtifactsFromEsBinaries') {
    dependsOn generatePomsFromEsBinaries
    def execOperations = project.objects.newInstance(InjectedExecOps).execOperations
    doLast {
        def plan = mirrorPlan()
        // upload-files-to-s3.sh takes all files going to one destination, so a coordinate's jar and POM
        // (which share a directory in the repository layout) go up in a single call.
        plan.jars().each { jar ->
            def pom = plan.poms().find { it.coordinate() == jar.coordinate() }
            def filesToUpload = [fileInBuildDir(jarFileNameOf(jar)).path]
            if (pom != null) {
                filesToUpload += fileInBuildDir(pomFileNameOf(pom)).path
            }
            execOperations.exec {
                environment libsStoreEnvironment
                commandLine(["${rootDir}/ci/upload-files-to-s3.sh".toString()] + filesToUpload + [destinationPathOf(jar.coordinate())])
            }
        }
    }
}


tasks.register('downloadEsBinaries') {
    doLast {
        def esTar = new File(layout.buildDirectory.asFile.get(), "es-${esVersion}.tar.gz")
        if (!esTar.exists()) {
            if (!layout.buildDirectory.asFile.get().exists()) {
                project.mkdir(layout.buildDirectory.asFile.get())
            }
            def esLinuxBinaries = "elasticsearch-${esVersion}-linux-x86_64.tar.gz"
            project.logger.info("Downloading ${esLinuxBinaries} ...")
            new URL("https://artifacts.elastic.co/downloads/elasticsearch/${esLinuxBinaries}")
                    .withInputStream { i -> esTar.withOutputStream { it << i } }
        }
        def esDir = new File(layout.buildDirectory.asFile.get(), "es-${esVersion}")
        project.logger.info("Extracting ${esTar.path} to ${esDir.path} ...")
        copy {
            from tarTree(esTar)
            into esDir
        }
    }
}