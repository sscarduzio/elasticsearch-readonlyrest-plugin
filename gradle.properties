publishedPluginVersion=1.71.0
pluginVersion=1.71.1-pre1
pluginName=readonlyrest
dockerImageNamespace=beshultd

org.gradle.jvmargs=-Xmx6144m
org.gradle.parallel=false
org.gradle.caching=true
systemProp.aws.java.v1.disableDeprecationAnnouncement=true

# Dependency downloads. The defaults are a 30 s connect and read timeout and 3 attempts with a 1 s
# first back-off. On CI runners Maven Central and the libs store sometimes answer slower than that.
# Gradle retries only a timeout, a dropped connection, a 5xx, a 408 and a 429. It does not retry a 403.
# The names come from JavaSystemPropertiesHttpTimeoutSettings and NetworkOperationBackOffAndRetry (Gradle 9.2).
systemProp.org.gradle.internal.http.connectionTimeout=60000
systemProp.org.gradle.internal.http.socketTimeout=120000
systemProp.org.gradle.internal.network.retry.max.attempts=6
systemProp.org.gradle.internal.network.retry.initial.backOff=2000

# NOTE: the CI image's baked JDK locations are recorded in /opt/gradle-home/gradle.properties
# (written at image-build time by ci/toolchains/JdkToolchains.Dockerfile), NOT here. They apply only to jobs
# using the baked GRADLE_USER_HOME (the Linux container jobs) and are never seen by the bare
# Windows agents (workspace-local GRADLE_USER_HOME). Putting absolute Linux paths in THIS file
# breaks Windows: Gradle reads them at init and aborts with "Cannot convert relative path
# \opt\java\jdk8 to an absolute file".
