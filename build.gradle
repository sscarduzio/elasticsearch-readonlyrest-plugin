import tech.beshu.ror.gradle.RorTaskFinder
import tech.beshu.ror.gradle.PrintEsModulesTask
import tech.beshu.ror.gradle.PrintTestMatricesTask

plugins {
    id 'base'
    id 'io.github.gradle-nexus.publish-plugin'      version '2.0.0-rc-1'
    id "idea"
    id "readonlyrest.format-conventions"
}

spotless {
    java {
        // build-base is an included build — excluded from the main project task graph,
        // so its Java sources are formatted here at the root level instead.
        target 'build-base/src/**/*.java'
    }
}

idea {
    module {
        downloadSources = true
    }
}

tasks.register("buildRorPlugin", RorTaskFinder) {
    dependsOn it.findRorTaskForEsVersion('buildRorPluginZip')
}

tasks.register("publishRorPlugin", RorTaskFinder) {
    dependsOn it.findRorTaskForEsVersion('uploadRorPluginToS3')
}

tasks.register("buildEsRorDockerImage", RorTaskFinder) {
    dependsOn it.findRorTaskForEsVersion('localRorDockerImage')
}

tasks.register("publishEsRorDockerImage", RorTaskFinder) {
    dependsOn it.findRorTaskForEsVersion('pushRorDockerImage')
}

tasks.register("publishEsRorPreBuildDockerImage", RorTaskFinder) {
    dependsOn it.findRorTaskForEsVersion('pushRorPreBuildDockerImage')
}

// Usage: ./gradlew printEsModules -PesMajor=8 --quiet
tasks.register("printEsModules", PrintEsModulesTask)

// Usage: ./gradlew printTestMatrices --quiet
tasks.register("printTestMatrices", PrintTestMatricesTask)

// Prints every ES major ROR builds, one per line, newest first, and writes them to
// build/es-modules/es-majors.txt. Scripts must read that file: configuration-time logging can
// pollute stdout even under --quiet. CI builds its matrices from this, so a new major needs no edit.
// Usage: ./gradlew printEsMajors --quiet
tasks.register("printEsMajors") {
    group = 'help'
    description = 'Prints every supported ES major version (one per line, newest first)'
    outputs.upToDateWhen { false }
    doLast {
        def majors = tech.beshu.ror.gradle.utils.EsModuleFinder.allSupportedEsMajors(rootProject)
        majors.each { println it }
        def majorsFile = layout.buildDirectory.file("es-modules/es-majors.txt").get().asFile
        majorsFile.parentFile.mkdirs()
        majorsFile.text = majors.collect { "$it\n" }.join()
    }
}

// Is the configured pluginVersion a pre-release? Prints `true` or `false`, and nothing else.
// A `-pre` suffix uploads a pre-release; anything else releases. This task is the only
// implementation of that rule; shell callers use `is_pre_release_version`.
// Usage: ./gradlew isPreReleaseVersion --quiet
tasks.register("isPreReleaseVersion") {
    group = 'help'
    description = 'Prints true if the configured pluginVersion is a pre-release, false otherwise'
    outputs.upToDateWhen { false }
    doLast {
        println pluginVersion.toString().contains('-pre')
    }
}

// Prints every ES version ROR supports, one per line, oldest first, and writes the same list to
// build/es-modules/es-versions.txt. A script reads that file: build-script logging can pollute
// stdout even under --quiet. Each version comes from a module's `supportedEsVersions`, so no script
// can drift from what CI builds.
// Usage: ./gradlew printAllSupportedEsVersions --quiet
tasks.register("printAllSupportedEsVersions") {
    group = 'help'
    description = 'Prints every supported ES version (one per line, oldest first)'
    outputs.upToDateWhen { false }
    doLast {
        def versions = tech.beshu.ror.gradle.utils.EsModuleFinder.allSupportedEsVersions(rootProject)
        versions.each { println it }
        def versionsFile = layout.buildDirectory.file("es-modules/es-versions.txt").get().asFile
        versionsFile.parentFile.mkdirs()
        versionsFile.text = versions.collect { "$it\n" }.join()
    }
}

group = 'tech.beshu.ror'
version = pluginVersion

nexusPublishing {
    repositories {
        sonatype {
            nexusUrl.set(uri("https://ossrh-staging-api.central.sonatype.com/service/local/"))
            stagingProfileId = System.getenv('MAVEN_STAGING_PROFILE_ID')
            username = System.getenv('MAVEN_REPO_USER')
            password = System.getenv('MAVEN_REPO_PASSWORD')
        }
    }

    clientTimeout = Duration.ofSeconds(120)
    connectTimeout = Duration.ofSeconds(60)

    transitionCheckOptions {
        maxRetries.set(50)
        delayBetween.set(java.time.Duration.ofMillis(10000))
    }
}

