// Compiles and runs the tests of a module on Java 17, while its main code keeps the module's own toolchain.
// tests-utils targets Java 17 (WireMock 4 needs it). A module with a Java 11 toolchain cannot use tests-utils
// without this plugin: Gradle refuses a Java 17 library on a Java 11 classpath, and a Java 11 JVM cannot load
// Java 17 class files. The main classpaths and the published jar keep the Java 11 level.
def testsJavaVersion = 17

configurations.matching { it.name in ['testCompileClasspath', 'testRuntimeClasspath'] }.configureEach {
    attributes { attribute(TargetJvmVersion.TARGET_JVM_VERSION_ATTRIBUTE, testsJavaVersion) }
}

tasks.matching { it.name in ['compileTestScala', 'compileTestJava'] }.configureEach {
    if (it.hasProperty('javaLauncher')) {
        javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(testsJavaVersion) }
    }
    if (it.hasProperty('javaCompiler')) {
        javaCompiler = javaToolchains.compilerFor { languageVersion = JavaLanguageVersion.of(testsJavaVersion) }
    }
}

tasks.withType(Test).configureEach {
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(testsJavaVersion) }
}
