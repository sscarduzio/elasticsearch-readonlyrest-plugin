plugins {
    id "readonlyrest.base-common-conventions"
}

repositories {
    maven { url 'https://repo.gradle.org/gradle/libs-releases' }
    maven { url 'https://artifacts.elastic.co/maven' }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

tasks.withType(ScalaCompile).configureEach {
    List<String> parameters = [
            "-feature",
            "-Xfatal-warnings",
            "-Wunused:implicits",
            "-Wunused:imports",
            "-Wunused:explicits",
            "-Wunused:strict-no-implicit-warn",
            "-Wunused:locals",
            "-Wunused:params",
            "-Wunused:privates",
            "-Wunused:nowarn",
    ]

    // Finally set the additionalParameters
    scalaCompileOptions.additionalParameters = parameters
}

sourceSets {
    test {
        resources {
            srcDirs += [
                    "$rootDir/tests-utils/src/main/resources"
            ]
        }
    }
}

// No -PesModule → the module that publishes the newest supported ES version. Both facts come from
// the es* modules' supportedEsVersions, so this follows automatically when a newer module is added.
def newestEsVersion = tech.beshu.ror.gradle.utils.EsModuleFinder
        .findTheNewestSupportedEsVersion(rootProject).orElseThrow()
def defaultEsModule = tech.beshu.ror.gradle.utils.EsModuleFinder
        .findEsModuleFor(rootProject, newestEsVersion).orElseThrow().name

def partitionBySharedEsUsage = { org.gradle.api.tasks.testing.Test task, List<String> suiteNames ->
    def dirs = task.testClassesDirs.files.collect { it.toPath() }
    def sharedEsSuites = tech.beshu.ror.buildbase.SuiteClassGraph.subtypesOf(
        'tech.beshu.ror.integration.utils.SingletonPluginTestSupport', dirs, suiteNames)
    [suiteNames.findAll { sharedEsSuites.contains(it) }, suiteNames.findAll { !sharedEsSuites.contains(it) }]
}

def configureIntegrationTest = { Test task, boolean sharedEsPhase ->
    // The java plugin wires these into `test` only; a registered Test task starts without them.
    task.testClassesDirs = sourceSets.test.output.classesDirs
    task.classpath = sourceSets.test.runtimeClasspath
    task.systemProperty "project.dir", rootProject.projectDir
    def module = project.findProperty('esModule') ?: defaultEsModule
    // Skips in bare aggregate builds (build/check); runs when the task is explicitly requested.
    // The module always has a default — no need to detect if -PesModule was passed.
    def explicitlyRequested = gradle.startParameter.taskNames.any { it.endsWith("integration-tests:${task.name}".toString()) }
    task.onlyIf { explicitlyRequested }
    task.doFirst {
        if (!project.hasProperty('esModule')) {
            logger.quiet(">>> no -PesModule given — defaulting to ${defaultEsModule}")
        }
    }
    // Build the singleton ES image once up-front so parallel workers never build concurrently.
    // Redundant K+1 boots are cache hits; kept so a bare local `:test` (no run-pipeline) still works.
    task.dependsOn 'warmDockerImageCache'
    task.systemProperty "esModule", module
    def explicitEsVersion = project.gradle.startParameter.projectProperties['esVersion']
    if (explicitEsVersion != null) { task.systemProperty "esVersion", explicitEsVersion }

    // SHARDING: shardCount=1 runs everything; K>1 partitions suites by name-hash mod K (disjoint cover).
    // Forks can't split the scalatest engine (gradle#8632), so parallelism = K sharded invocations.
    // Gate on an EXPLICIT -PshardIndex (ShardedGradlewTest always passes it to children): the parent
    // `shardedTest -PshardCount=K` invocation also configures this task, and on a fresh workspace the
    // class-tree walk below runs at configuration time BEFORE testClasses compiled anything — 0 files
    // matched and the guard killed the parent build. No shardIndex → not a shard → full suite filter.
    def shardCount = (project.findProperty('shardCount') ?: '1').toInteger()
    def shardIndex = (project.findProperty('shardIndex') ?: '0').toInteger()
    def sharded = shardCount > 1 && project.hasProperty('shardIndex')
    if (sharedEsPhase && !sharded) {
        // Disable, do not just leave the filter empty: an enabled Test task with no filter runs EVERY suite.
        task.enabled = false
        return
    }
    // Disjoint OUTPUT dirs per shard: sibling shards run concurrently in the SAME workspace, and
    // the Test task's shared result dirs (binary results + junit XML + html) get cross-corrupted —
    // "Could not write XML test results" / truncated TEST-*.xml — killing otherwise-green shards.
    if (project.hasProperty('shardIndex')) {
        // Windows native-ES runs key ports and install dirs off this (see WindowsEsPortProvider /
        // WindowsEsDirectoryManager); harmless on Linux where docker isolates everything.
        task.systemProperty 'ror.shard.index', shardIndex
        def phaseSuffix = sharedEsPhase ? '-shared-es' : ''
        task.reports.junitXml.outputLocation = layout.buildDirectory.dir("test-results/shard-${shardIndex}${phaseSuffix}")
        task.reports.html.outputLocation = layout.buildDirectory.dir("reports/tests/shard-${shardIndex}${phaseSuffix}")
        task.binaryResultsDirectory.set(layout.buildDirectory.dir("test-results/shard-${shardIndex}${phaseSuffix}-bin"))
    }
    task.filter {
        if (sharded) {
            // Partitioning lives in build-base's SuiteSharder (pure, unit-tested); this block is
            // only the Gradle I/O around it: walk the class tree, parse suite-timings.json (with
            // -PbalancedShards=true / ROR_BALANCED_SHARDS), include the shard's suites.
            def balanced = (project.findProperty('balancedShards') ?: System.getenv('ROR_BALANCED_SHARDS') ?: 'false').toBoolean()
            def timings = balanced ? tech.beshu.ror.buildbase.SuiteSharder.timingsFrom(file('suite-timings.json')) : [:]
            def suites = []
            task.testClassesDirs.asFileTree.matching {
                // `*Suite*` (not `*Suite`) so classes ending in `Suites` shard too; `base/` traits
                // excluded so the zero-match guard counts only real suites.
                include 'tech/beshu/ror/integration/suites/**/*Suite*.class'
                exclude '**/*$*.class'   // skip nested/companion classes
                exclude 'tech/beshu/ror/integration/suites/base/**'
            }.visit { fd ->
                if (!fd.directory) {
                    suites << fd.path.replace('/', '.').replaceAll(/\.class$/, '')
                }
            }
            def shardSuites = tech.beshu.ror.buildbase.SuiteSharder.suitesFor(suites, shardCount, shardIndex, timings)
            if (shardSuites.isEmpty()) {
                throw new GradleException("Shard ${shardIndex}/${shardCount} matched 0 suites — check shardCount/shardIndex.")
            }
            def (sharedEsSuites, ownClusterSuites) = partitionBySharedEsUsage(task, shardSuites)
            def phaseSuites = sharedEsPhase ? sharedEsSuites : ownClusterSuites
            if (phaseSuites.isEmpty()) {
                // Same trap as above: an empty filter would run every suite.
                task.enabled = false
            } else {
                phaseSuites.each { includeTestsMatching it }
            }
            logger.quiet(">>> integration-tests shard ${shardIndex}/${shardCount} ${task.name}: " +
                "${phaseSuites.size()} of ${shardSuites.size()} suites " +
                "(${sharedEsSuites.size()} shared-ES / ${ownClusterSuites.size()} own-cluster; ${balanced ? 'balanced' : 'hash'} packing)")
        } else {
            includeTestsMatching 'tech.beshu.ror.integration.suites.*'
        }
    }
    // Gradle-native test machinery (replaces maiflai's one-JVM runner); ScalaTest tags map to JUnit tags.
    task.useJUnitPlatform {
        includeEngines 'scalatest'
        excludeTags('tech.beshu.tags.ExcludeESModule.' + module, 'tech.beshu.tags.IgnoreOnWindows')
    }
    // Suites run serially within a JVM (shared singleton ES); junit.jupiter parallel is a NO-OP for
    // the scalatest engine and would mask silent corruption — fail fast if anyone enables it.
    def parallelProp = System.getProperty('junit.jupiter.execution.parallel.enabled')
    if (parallelProp != null && parallelProp.toBoolean()) {
        throw new GradleException(
            "junit.jupiter.execution.parallel.enabled=true is unsupported for integration-tests: " +
            "the scalatest engine ignores it and the singleton ES requires serial-within-JVM execution. " +
            "Use -PshardCount/-PshardIndex to parallelise across separate worker JVMs instead.")
    }
    task.outputs.upToDateWhen { false }
    // Live console output — native test execution is silent without this (same block as core's).
    task.testLogging {
        showStandardStreams = true
        exceptionFormat = 'full'
        events "standardOut", "started", "passed", "skipped", "failed"
    }
    // maxParallelForks=1 always — forks can't split the scalatest engine (gradle#8632), so a 2nd fork
    // gets no work. Parallelism = sharding (multiple -PshardCount invocations), not forks.
    task.maxParallelForks = 1
    // Per worker JVM. The JVM only orchestrates (streams small HTTP to ES, no bulk data); measured peak
    // live heap is ~50MB, so 512m is ~10x headroom. Overridable via -PitTestHeap for outlier suites.
    task.maxHeapSize = project.findProperty('itTestHeap') ?: '512m'
    // bounded like every other JVM in the CI leg, so a runaway fails in-process, not via the host OOM killer
    task.jvmArgs '-XX:MaxMetaspaceSize=512m'
}

// Why this exists: a suite that uses the shared ES keeps it alive until its JVM exits, so a shard
// that ran those suites first and then went on to the heavy own-cluster suites was still holding an
// idle ES underneath them. Splitting the shard into two Test tasks makes the JVM boundary release
// it: `sharedEsSuitesTest` runs everything that uses the shared ES and then exits, taking the ES
// with it, and `test` runs the rest in a fresh JVM that never starts one. Less memory held at the
// point in the run where the host needs it most.
//
// Unsharded, `test` alone still runs everything.
tasks.register('sharedEsSuitesTest', Test) { configureIntegrationTest(it, true) }
test { configureIntegrationTest(it, false) }
// Ordering must be declared: passing both task names on the command line does not guarantee it.
test.mustRunAfter 'sharedEsSuitesTest'
// lifecycle, NOT quiet(): this runs at configuration time, so quiet() pollutes the stdout that
// list_es_modules (publish-ror-plugins.sh) parses from `printEsModules --quiet`.
logger.lifecycle(">>> integration-tests maxParallelForks=1 (1 ES/JVM; parallelism via -PshardCount)")

dependencies {
    testImplementation project(':tests-utils')

    testImplementation  group: 'jakarta.xml.bind',              name: 'jakarta.xml.bind-api',       version: '2.3.2'
    testImplementation  group: 'org.glassfish.jaxb',            name: 'jaxb-runtime',               version: '2.3.2'
    testImplementation  group: 'ch.qos.logback',                name: 'logback-classic',            version: '1.5.22'
    testRuntimeOnly     group: 'co.helmethair',                 name: 'scalatest-junit-runner',     version: '0.2.0'
    testRuntimeOnly     group: 'org.junit.platform',            name: 'junit-platform-launcher',    version: '1.10.2'
    testImplementation  group: 'org.scala-lang',                name: 'scala3-library_3',           version: '3.3.7'
    testImplementation  group: 'org.scalatest',                 name: 'scalatest_3',                version: '3.2.19'
}

tasks.register('warmDockerImageCache', JavaExec) {
    // Mirror test's gate: dependsOn targets run even when the dependent is onlyIf-skipped, so this
    // must skip in bare aggregate builds too (else every `./gradlew build` boots a Docker ES image).
    def explicitlyRequested = gradle.startParameter.taskNames.any {
        it.endsWith('integration-tests:test') || it == 'integration-tests:test' ||
            it.endsWith('warmDockerImageCache') || it.endsWith('shardedTest')
    }
    onlyIf { explicitlyRequested }
    systemProperty 'project.dir', rootProject.projectDir
    systemProperty 'esModule', (project.findProperty('esModule') ?: defaultEsModule)
    def explicitEsVersion = project.gradle.startParameter.projectProperties['esVersion']
    if (explicitEsVersion != null) { systemProperty 'esVersion', explicitEsVersion }
    mainClass.set('tech.beshu.ror.utils.containers.WarmDockerImageCache')
    classpath = sourceSets.test.runtimeClasspath
}

// Rebuilds suite-timings.json from the junit XMLs of the LAST test run and warns about drift
// vs the committed file. CI runs it on the es90x leg (uploads the result as the
// `suite-timings-regenerated` artifact and emits ::warning:: annotations on drift); locally:
//   ./gradlew integration-tests:test -PesModule=es90x && ./gradlew integration-tests:regenerateSuiteTimings
tasks.register('regenerateSuiteTimings') {
    doLast {
        // Wall-time estimation (boot + exec, median first-boot) lives in build-base's
        // SuiteTimings.wallTimes (pure, unit-tested); this task only parses the junit XMLs
        // and does the JSON I/O around it (same split as SuiteSharder).
        def byShard = [:].withDefault { [] }
        fileTree(dir: layout.buildDirectory, includes: ['test-results/**/TEST-*.xml']).each { f ->
            def suite = new groovy.xml.XmlSlurper().parse(f)
            def name = suite.@name.toString()
            if (!name.startsWith('tech.beshu.ror.integration.suites')) return
            byShard[f.parentFile.path] << new tech.beshu.ror.buildbase.SuiteTimings.SuiteRun(
                name,
                java.time.Instant.parse(suite.@timestamp.toString()),
                Double.parseDouble(suite.@time.toString()))
        }
        def times = tech.beshu.ror.buildbase.SuiteTimings.wallTimes(byShard.values())
        if (times.isEmpty()) {
            logger.quiet('No test-results found under build/ — run the integration tests first.')
            return
        }
        def committedFile = new groovy.json.JsonSlurper().parse(file('suite-timings.json'))
        // Thresholds + comparison live in build-base's SuiteTimings (pure, unit-tested);
        // this task only does the XML/JSON I/O around it (same split as SuiteSharder).
        def committed = tech.beshu.ror.buildbase.SuiteSharder.timingsFrom(file('suite-timings.json'))
        def drifts = tech.beshu.ror.buildbase.SuiteTimings.driftReport(committed, times)
        drifts.each { logger.warn("::warning::suite-timings ${it}") }
        def out = layout.buildDirectory.file('suite-timings-regenerated.json').get().asFile
        out.text = groovy.json.JsonOutput.prettyPrint(
            groovy.json.JsonOutput.toJson([_readme: committedFile._readme, times: times])) + '\n'
        logger.quiet(">>> regenerated ${times.size()} suite timings -> ${out} (${drifts.size()} drift warning(s))")
    }
}

// Sharded-IT orchestrator: runs K parallel `./gradlew integration-tests:test -PshardIndex=i`
// JVMs (one ES container each). Usage: ./gradlew integration-tests:shardedTest -PshardCount=2 -PesModule=es94x
tasks.register('shardedTest', tech.beshu.ror.buildbase.ShardedGradlewTest) {
    dependsOn 'warmDockerImageCache', 'testClasses'
    // Always run — spawns external gradle processes whose state Gradle can't track.
    outputs.upToDateWhen { false }
    getShardCount().set((project.findProperty('shardCount') ?: '1') as int)
    getEsModule().set(project.findProperty('esModule') ?: defaultEsModule)
    getEsVersion().set(project.gradle.startParameter.projectProperties['esVersion'] as String)
}

