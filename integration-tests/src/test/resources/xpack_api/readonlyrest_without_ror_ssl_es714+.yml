readonlyrest:

  access_control_rules:

    # ES container initializer need this rule to configure ES instance after startup
    - name: "CONTAINER ADMIN"
      type: allow
      auth_key: admin:container

    - name: "Fleet server"
      type: allow
      token_authentication:
        type: "service-token"
        username: "fleet"
      indices: [".fleet-servers", ".fleet-agents", ".fleet-actions", ".fleet-policies", ".fleet-policies-leader", ".fleet-enrollment-api-keys"]

    - name: "Agents"
      type: allow
      token_authentication:
        type: "api-key"
        username: "fleet"
      indices: [".apm-agent-configuration", "metrics-*", "traces-*", "logs-*"]

    - name: "test1"
      indices: ["test1_index_a"]
      auth_key: dev1:test

    - name: "test2"
      indices: ["test2_index"]
      auth_key: dev2:test
      filter: '{"query_string":{"query":"name:(john)"}}'
      fields: ["_source", "name"]

    - name: "test2 fields whitelist"
      indices: ["test2_index"]
      auth_key: dev8:test
      fields: ["name.keyword"]

    - name: "test2 fields blacklist"
      indices: ["test2_index"]
      auth_key: dev9:test
      fields: ["~age.keyword"]

    - name: "test3"
      indices: ["test3*", "rollup_test3_*"]
      auth_key: dev3:test

    - name: "test4"
      indices: ["test4*", "rollup_test4_*"]
      auth_key: dev4:test

    - name: "test5"
      indices: ["test5*", "rollup_test5_*"]
      auth_key: dev5:test

    - name: "test6"
      indices: ["test6*", "rollup_test6_*"]
      auth_key: dev6:test

    - name: "admin sql"
      verbosity: error
      type: allow
      indices: ["bookstore", "library", "bookshop"]
      auth_key: sqladmin:pass

    - name: "dev1 sql"
      auth_key: dev1sql:test
      indices: ["bookstore"]
      fields: ["~price"]

    - name: "dev2 sql"
      auth_key: dev2sql:test
      indices: ["library"]
      fields: ["~internal_id"]

    - name: "dev3 sql"
      auth_key: dev3sql:test
      indices: ["bookstore"]
      filter: '{"query_string":{"query":"name:(Dune)"}}'

    - name: "dev4 sql"
      auth_key: dev4sql:test
      indices: ["book_catalog"]

    - name: "dev5 sql"
      auth_key: dev5sql:test
      indices: ["book_*"]

    - name: "dev6 sql"
      auth_key: dev6sql:test
      indices: ["book_prices"]

    - name: "dev7 sql"
      auth_key: dev7sql:test
      indices: ["book_catalog", "book_prices"]

    - name: "dev7"
      auth_key: dev7:test
      indices: ["test7_*"]
      filter: '{ "match": { "content.app": { "query": "a1" } }}'