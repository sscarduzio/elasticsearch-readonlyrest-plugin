readonlyrest:

  access_control_rules:

    # ES container initializer need this rule to configure ES instance after startup
    - name: "CONTAINER ADMIN"
      type: allow
      auth_key: admin:container

    - name: "test1"
      indices: ["test1_index_a"]
      auth_key: dev1:test

    - name: "test2"
      indices: ["test2_index"]
      auth_key: dev2:test
      filter: '{"query_string":{"query":"name:(john)"}}'
      fields: ["_source", "name"]

    - name: "test2 fields whitelist"
      indices: ["test2_index"]
      auth_key: dev8:test
      fields: ["name.keyword"]

    - name: "test2 fields blacklist"
      indices: ["test2_index"]
      auth_key: dev9:test
      fields: ["~age.keyword"]

    - name: "test3"
      indices: ["test3*", "rollup_test3_*"]
      auth_key: dev3:test

    - name: "test4"
      indices: ["test4*", "rollup_test4_*"]
      auth_key: dev4:test

    - name: "test5"
      indices: ["test5*", "rollup_test5_*"]
      auth_key: dev5:test

    - name: "test6"
      indices: ["test6*", "rollup_test6_*"]
      auth_key: dev6:test

    - name: "dev7"
      auth_key: dev7:test
      indices: ["test7_*"]
      filter: '{ "match": { "content.app": { "query": "a1" } }}'

    # Each response to these users gets a session cookie with the name of the user.
    - name: "concurrent requests alice"
      verbosity: error
      auth_key: alice:test
      session_max_idle: 1h
      indices: ["concurrent_requests_index"]
      filter: '{"match":{"owner":"all"}}'

    - name: "concurrent requests bob"
      verbosity: error
      auth_key: bob:test
      session_max_idle: 1h
      indices: ["concurrent_requests_index"]
      filter: '{"match":{"owner":"all"}}'

    - name: "concurrent requests carol"
      verbosity: error
      auth_key: carol:test
      session_max_idle: 1h
      indices: ["concurrent_requests_index"]
      filter: '{"match":{"owner":"all"}}'
