readonlyrest:

  global_settings:
    fls_engine: "es"

  access_control_rules:

    # ES container initializer need this rule to configure ES instance after startup
    - name: "CONTAINER ADMIN"
      auth_key: admin:container
      verbosity: error

    - name: user1
      auth_key: "user1:pass"
      fields: ["_source", "allowedField"]

    - name: user2
      auth_key: "user2:pass"
      fields: ["~notAllowedField"]

    - name: user3
      auth_key: "user3:pass"
      filter: '{"bool":{"must_not":[{"term":{"allowedField":"allowed:2"}}]}}'
      fields: ["_source", "allowedField"]

    - name: user4
      auth_key: "user4:pass"
      filter: '{"bool":{"must_not":[{"term":{"allowedField":"allowed:2"}}]}}'
      fields: ["~notAllowedField"]

    - name: user5
      auth_key: "user5:pass"
      indices: ["terms-index"]
      fields: ["_source", "allowedTerm.keyword"]

    - name: user6
      auth_key: "user6:pass"
      indices: ["terms-index"]
      fields: ["~notAllowedTerm.keyword"]
