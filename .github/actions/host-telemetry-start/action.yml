name: 'Start host telemetry'
description: >-
  Starts the two background samplers of a job and leaves them running until the host-telemetry-report
  action stops them. ci/telemetry/resource-sampler.sh records the CPU time and the IO wait of the
  machine every 5 s; ci/telemetry/step-cost.py reads that series back out of the job log and gives
  every step its CPU and IO cost. ci/telemetry/mem-telemetry.sh records host memory, the top
  processes by RSS and container deaths every 10 s; it is the only evidence an OOM kill leaves
  behind.

  The file layout under RUNNER_TEMP is the contract between the two actions: the memory sampler
  writes host-telemetry/mem-telemetry-<id>.log with its PID file next to it, and the resource sampler
  owns host-telemetry/resource-sampler. The id is in the name, so the caller chooses the id, not the
  shape.

inputs:
  id:
    description: >-
      What tells this job's telemetry from another's once the artifacts are downloaded side by side.
      The report action names its artifact after it, so it must be unique in the run, and it must say
      which job the telemetry comes from. The job name plus the matrix leg does both, except where
      the job name reads like another job's: the e2e image build is named build_es_<module>, which a
      reader takes for a build_ror leg, so its id is e2e_build_es_<module>.
    required: true

runs:
  using: composite
  steps:
    - shell: bash
      env:
        LOG_ID: ${{ inputs.id }}
      run: |
        DIR="$RUNNER_TEMP/host-telemetry"
        mkdir -p "$DIR"
        ci/telemetry/resource-sampler.sh start
        ci/telemetry/mem-telemetry.sh start "$DIR/mem-telemetry-$LOG_ID.log" \
          > "$DIR/mem-telemetry-$LOG_ID.pid"
