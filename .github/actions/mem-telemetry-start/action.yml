name: 'Start memory telemetry'
description: >-
  Starts the background sampler of ci/mem-telemetry.sh and records its PID under RUNNER_TEMP.
  Pair it with the mem-telemetry-report action, which stops the sampler and prints the reports.
  Two things are the contract between them: the mem-telemetry-<id>.pid file under RUNNER_TEMP, and
  the mem-telemetry-<id>.log name this action gives the sampler. The caller chooses the id and the
  directory, not the shape. The id is in both names, so a job may start more than one sampler.

inputs:
  id:
    description: >-
      What tells this log from another once several are downloaded side by side — the ES module of
      a matrix leg, or the CI job id. The report action names its artifact after it, so it must be
      unique in the run.
    required: true
  log-dir:
    description: 'Directory the sampler writes into. Pass the same one to the report action.'
    required: true

runs:
  using: composite
  steps:
    - shell: bash
      env:
        LOG_DIR: ${{ inputs.log-dir }}
        LOG_ID: ${{ inputs.id }}
      run: ci/mem-telemetry.sh start "$LOG_DIR/mem-telemetry-$LOG_ID.log" > "$RUNNER_TEMP/mem-telemetry-$LOG_ID.pid"
