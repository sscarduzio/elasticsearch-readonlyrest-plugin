name: Resolve the toolchains image
description: >-
  Selects the toolchains image of this commit (ci/toolchains/select-image.sh): its deps tag, or the
  develop tag when the deps tag is missing. Then picks the name every `container:` job pulls: the
  Docker Hub mirror on the normal path, Docker Hub itself on the fallback. Needs no credentials. The
  caller must check the repo out first, and must not be a container job: a runner pulls a container
  image before step 1, so a job cannot resolve its own.

outputs:
  image:
    description: The image reference to put in `container:`. Carries a digest on the mirrored path.
    value: ${{ steps.toolchains.outputs.image }}
  deps-tag:
    description: The deps tag of this commit.
    value: ${{ steps.select.outputs.deps_tag }}
  deps-missing:
    description: "'true' when the deps tag does not exist and the run takes the develop tag."
    value: ${{ steps.select.outputs.deps_missing }}

runs:
  using: composite
  steps:
    - id: select
      shell: bash
      run: |
        set -euo pipefail
        out=$(ci/toolchains/select-image.sh)
        echo "$out"
        grep -E '^(deps_tag|deps_missing)=' <<<"$out" >> "$GITHUB_OUTPUT"
        echo "TOOLCHAINS_IMAGE=$(sed -n 's/^image=//p' <<<"$out")" >> "$GITHUB_ENV"
        sed -n 's/^digest=//p' <<<"$out" > .toolchains-digest
    - id: toolchains
      shell: bash
      run: ci/resolve-toolchains-image.sh
