name: 'Report memory telemetry'
description: >-
  Stops the sampler that mem-telemetry-start started under this id, prints its report as a
  collapsible group, and uploads its log. Call it with `if: always()`: a job that ran out of memory
  is the one whose telemetry a reader wants.

  The report lists the containers of this job when ROR_CI_JOB_ID is in the job environment, and
  says it cannot when it is not.

inputs:
  id:
    description: 'The id the start action was given. It names the PID file, the log and the artifact.'
    required: true
  log-dir:
    description: 'Directory the sampler wrote into. The same one the start action was given.'
    required: true

runs:
  using: composite
  steps:
    - shell: bash
      env:
        LOG_DIR: ${{ inputs.log-dir }}
        LOG_ID: ${{ inputs.id }}
      run: |
        PID_FILE="$RUNNER_TEMP/mem-telemetry-$LOG_ID.pid"
        if [ -f "$PID_FILE" ]; then
          ci/mem-telemetry.sh stop "$(cat "$PID_FILE")" || true
        fi
        LOG="$LOG_DIR/mem-telemetry-$LOG_ID.log"
        if [ -f "$LOG" ]; then
          echo "::group::$(basename "$LOG") report"
          ci/mem-telemetry.sh report "$LOG"
          echo "::endgroup::"
        fi
    # Upload even when the report above failed: the log is the point, the report is a summary.
    - if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: mem-telemetry-${{ inputs.id }}
        path: ${{ inputs.log-dir }}/mem-telemetry-${{ inputs.id }}.log
        if-no-files-found: ignore
