name: 'Publish test results'
description: >-
  Uploads the JUnit XML that the tests of this job wrote, as the `<id>-results` artifact. It finds
  the reports anywhere in the tree, so it serves a unit-test job and a sharded integration-test job
  alike. Then it names each failed test in an error annotation and in the job summary.

  The caller owns the condition. `if: failure()` is enough when only a failed run needs a report;
  a leg whose green XMLs feed suite-timings regeneration calls it with `if: always()`.

inputs:
  id:
    description: 'Names the artifact, so it must be unique in the run. Example: it-linux-es90x.'
    required: true

runs:
  using: composite
  steps:
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: ${{ inputs.id }}-results
        path: '**/TEST*.xml'
        if-no-files-found: ignore
    # After the upload, and never a failure of its own: the names are a convenience, and a green leg
    # must not turn red because one report was unreadable.
    - shell: bash
      continue-on-error: true
      env:
        ID: ${{ inputs.id }}
      run: bash ci/junit-failures.sh . "$ID"
