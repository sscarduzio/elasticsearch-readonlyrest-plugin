name: ROR ES Action Strings

on:
  push:
    branches:
      - master
    paths:
      - 'es*/gradle.properties'
      - 'ci/actionstrings/**'
  workflow_dispatch:

# Serialize racing master pushes: a stale parallel run must not push over a newer one.
concurrency:
  group: actionstrings

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ror es
        uses: actions/checkout@v4
        with:
          path: main

      - name: Checkout docs
        uses: actions/checkout@v4
        with:
          path: docs
          repository: beshu-tech/readonlyrest-docs
          token: ${{ secrets.GH_PAT }}

      - run: |
          mv docs main/readonlyrest-docs
          cd main
          git config --global advice.detachedHead false
          bash -x ci/actionstrings/run.sh
          cd readonlyrest-docs
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add .
          # `|| true` on the commit only: an empty diff is a normal outcome. The push has no
          # `|| true`, so a failed push to the docs repo fails this job.
          git commit -m "commit new action strings" || true
          git push
