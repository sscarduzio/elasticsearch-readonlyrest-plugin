name: CI Flake Ledger

# Ranks CI failures by how often they REPEAT, so triage can target a pattern instead of a single red.
# Two layers: job level (a leg dying before any test runs — image build, container start, host OOM,
# runner provisioning, registry throttling) and, optionally, test level from the junit artifacts.
#
# Manual-only: it reads CI history, changes nothing, and is meant to be run when deciding whether a
# red is worth chasing. The same script runs locally — see ci/utils/flake-ledger.sh.
on:
  workflow_dispatch:
    inputs:
      runs:
        description: 'How many recent ci.yml runs to inspect'
        type: number
        default: 20
        required: true
      branch:
        description: 'Branch to scan (empty = all branches)'
        type: string
        required: false
      with_tests:
        description: 'Also download junit artifacts for the test-level ledger (slow, GBs)'
        type: boolean
        default: false
        required: false

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: bash

jobs:
  ledger:
    name: Ledger
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false }

      - name: Build the ledger
        env:
          GH_TOKEN: ${{ github.token }}
          # Inputs via env, never `${{ }}` in the script body: that is a shell-injection vector.
          INPUT_BRANCH: ${{ inputs.branch }}
          INPUT_RUNS: ${{ inputs.runs }}
          INPUT_WITH_TESTS: ${{ inputs.with_tests }}
        run: |
          args=(--runs "$INPUT_RUNS")
          [ -n "$INPUT_BRANCH" ] && args+=(--branch "$INPUT_BRANCH")
          [ "$INPUT_WITH_TESTS" = "true" ] && args+=(--with-tests)
          # Also into the job summary, so the result is readable without opening the log.
          ci/utils/flake-ledger.sh "${args[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
