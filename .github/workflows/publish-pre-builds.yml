name: Publish pre-builds

# Manual-only: no push/pull_request triggers (Azure's `trigger: none` / `pr: none`).
on:
  workflow_dispatch:
    inputs:
      esVersions:
        description: 'Space or comma-separated list of ES versions (e.g., "9.4.2" or "9.4.2 8.19.16")'
        type: string
        required: true
      targetBranch:
        description: 'Branch to build from (falls back to develop if not found, builds from the selected branch if empty)'
        type: string
        required: false
        default: ''
      tag:
        description: 'Optional image tag. When set, each image is also published as <esVersion>-ror-<tag> (on top of the canonical <esVersion>-ror-<pluginVersion>)'
        type: string
        required: false
        default: ''
      forceRebuild:
        description: 'Rebuild even if an image for the current commit already exists (skips the unchanged-sources optimization)'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  publish:
    name: Publishing
    runs-on: ubicloud-standard-4
    timeout-minutes: 600
    # No container: the build drives the host Docker daemon (docker build/push, buildx imagetools,
    # `docker system prune` between versions), so it needs a JDK on the runner (Azure used
    # JavaToolInstaller@0 17) rather than the baked toolchains image. Point GRADLE_USER_HOME at a
    # writable workspace path and let Gradle auto-provision the other JDKs the plugin build needs.
    env:
      GRADLE_USER_HOME: ${{ github.workspace }}/.gradle-home
      GRADLE_OPTS: '-Dorg.gradle.java.installations.auto-download=true'
      # Ubicloud runners are ephemeral VMs without Azure's preinstalled bloat: free-host-disk.sh no-ops.
      AGENT_ISSELFHOSTED: '1'
    steps:
      # fetch-depth: 0 so the targetBranch checkout below can resolve any origin/* ref, and so
      # `git rev-parse --short HEAD` (the source-identity image tag) sees real history.
      # persist-credentials mirrors Azure's persistCredentials.
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, persist-credentials: true }

      # GitHub's dispatch UI already picks the ref the workflow runs from, but that ref must contain
      # this file. targetBranch keeps Azure's escape hatch: dispatch from develop, build any branch.
      - name: Checkout target branch
        env:
          TARGET_BRANCH: ${{ inputs.targetBranch }}
        run: |
          if [ -n "$(echo "$TARGET_BRANCH" | tr -d '[:space:]')" ]; then
            if git show-ref --verify --quiet "refs/remotes/origin/$TARGET_BRANCH"; then
              echo "Branch '$TARGET_BRANCH' found, checking out"
              git checkout "$TARGET_BRANCH"
            else
              echo "Branch '$TARGET_BRANCH' not found, falling back to develop"
              git checkout develop
            fi
          fi

      - name: Free host disk (no-op on self-hosted)
        run: ci/free-host-disk.sh

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }

      - name: Restore Gradle cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.gradle-home
          key: gradle-${{ runner.os }}-${{ hashFiles('**/gradle/wrapper/gradle-wrapper.properties', '**/settings.gradle*', '**/build.gradle*', '**/gradle.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: publish_pre_builds_docker_images
        env:
          ROR_TASK: publish_pre_builds_docker_images
          # run-pipeline.sh reads the version list from BUILD_ROR_ES_VERSIONS.
          BUILD_ROR_ES_VERSIONS: ${{ inputs.esVersions }}
          IMAGE_TAG: ${{ inputs.tag }}
          FORCE_REBUILD: ${{ inputs.forceRebuild }}
          DOCKER_REGISTRY_USER: ${{ secrets.DOCKER_REGISTRY_USER }}
          DOCKER_REGISTRY_PASSWORD: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}
        run: |
          set -e

          if [ -z "$(echo "$BUILD_ROR_ES_VERSIONS" | tr -d '[:space:],')" ]; then
            echo "::error::esVersions input is required"
            exit 1
          fi

          if ! echo "$DOCKER_REGISTRY_PASSWORD" | docker login -u "$DOCKER_REGISTRY_USER" --password-stdin; then
            echo "::error::Failed to login to Docker registry"
            exit 1
          fi

          echo ">>> Publishing pre-build docker images for: $BUILD_ROR_ES_VERSIONS"
          ci/run-pipeline.sh
