# Publishing, in a workflow of its own.
#
# Two ways in, and they differ only in the trigger:
#
#   workflow_run       CI finished on develop or master, and every job of it passed
#   workflow_dispatch  an operator releases without waiting for tests
#
# TWO TRAPS, both from `workflow_run` (see ci/CI.md):
#   - `github.ref` and `github.sha` point at the DEFAULT branch, not at the commit CI tested. Every
#     checkout below uses RELEASE_SHA, and the branch comes from RELEASE_BRANCH. Never `github.ref`.
#   - GitHub fires `workflow_run` only for a copy of this file on the default branch (master). A
#     change here does nothing until it lands there.
name: Release

on:
  workflow_run:
    workflows: [ CI ]
    types: [ completed ]
    branches: [ develop, master ]
  workflow_dispatch:
    inputs:
      confirm_version:
        description: >-
          Type the pluginVersion from gradle.properties, exactly. The run stops if it does not match
          the branch you launched from. This is the only guard against an accidental release.
        required: true
        type: string

# One release per branch, and never cancel one in flight.
concurrency:
  group: release-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  # The commit CI tested, or the commit the operator dispatched from. Order matters: on a
  # workflow_run, github.sha is the default branch and would release untested code.
  RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
  RELEASE_BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
  GRADLE_USER_HOME: /opt/gradle-home
  GRADLE_OPTS: '-Dorg.gradle.java.installations.auto-download=false'

jobs:

  # ── RELEASE_SETUP ─────────────────────────────────────────────────────────
  # May this run publish, and which branch is it publishing from?
  #
  # The first question is one line, because `workflow_run` reports CI as a single conclusion. The
  # `event == 'push'` test matters: workflow_run also fires for CI runs on pull requests, whose
  # head_branch can be anything, including a branch named develop.
  #
  # WHAT to publish is not settled here. That reads gradle.properties, and the build owns that —
  # see the isPreReleaseVersion task, which `discover` runs.
  #
  # This job holds no container, and it cannot: it is the job that picks one.
  release_setup:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.conclusion == 'success'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      image:     ${{ steps.toolchains.outputs.image }}
      is_master: ${{ steps.branch.outputs.is_master }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { ref: "${{ env.RELEASE_SHA }}", fetch-depth: 1, persist-credentials: false }
      # Only the manual path needs a guard. The workflow_run path already carries a green CI run on
      # a branch the trigger filtered.
      #
      # ci-lib.sh is the one reader of gradle.properties, by its own rule — a second parser drifts.
      - name: Check the branch and the typed version
        if: github.event_name == 'workflow_dispatch'
        env:
          CONFIRM_VERSION: ${{ inputs.confirm_version }}
        run: |
          set -e
          case "$RELEASE_BRANCH" in
            develop|master) ;;
            *) echo "::error::A release runs from develop or master only. This is $RELEASE_BRANCH."; exit 1 ;;
          esac
          . ci/ci-lib.sh
          ACTUAL=$(gradle_property pluginVersion)
          if [ "$CONFIRM_VERSION" != "$ACTUAL" ]; then
            echo "::error::You typed '$CONFIRM_VERSION'. $RELEASE_BRANCH carries '$ACTUAL'."
            exit 1
          fi
      - id: toolchains
        uses: ./.github/actions/resolve-toolchains-image
      - id: branch
        run: |
          echo "is_master=$([ "$RELEASE_BRANCH" = master ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          # Two runs, and the Actions graph cannot draw an arrow between them. This is the
          # breadcrumb back to the CI run that earned this release.
          {
            echo "Branch: $RELEASE_BRANCH"
            echo "Commit: $RELEASE_SHA"
            echo "${{ github.event.workflow_run.html_url && format('Triggered by CI run {0}', github.event.workflow_run.html_url) || 'Dispatched by hand. No tests ran.' }}"
          } >> "$GITHUB_STEP_SUMMARY"

  # ── DISCOVER ──────────────────────────────────────────────────────────────
  # What to publish, and for which ES generations. Both answers come from gradle: `printEsMajors`
  # gives the majors, the same task ci.yml's discover uses, and `isPreReleaseVersion` decides
  # upload_pre_ror against release_ror.
  #
  # This is also where the image is proven, with the check ci.yml's toolchains_verify runs. It is
  # the first container job here, so a bad image stops one cheap job, not a self-hosted matrix.
  discover:
    needs: release_setup
    runs-on: ubuntu-latest
    container: &toolchains_container
      image: ${{ needs.release_setup.outputs.image }}
    timeout-minutes: 10
    outputs:
      majors_matrix:      ${{ steps.plan.outputs.majors_matrix }}
      is_release_version: ${{ steps.plan.outputs.is_release_version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { ref: "${{ env.RELEASE_SHA }}", fetch-depth: 1, persist-credentials: false }
      - uses: ./.github/actions/verify-toolchains-image
      - name: Derive the ES majors
        run: ./gradlew --no-daemon -q printEsMajors
      - id: plan
        run: |
          set -eo pipefail

          # printEsMajors writes a file, because a list is easy to pollute. Read that, not stdout.
          MAJORS_FILE=build/es-modules/es-majors.txt
          # No major means nothing gets published. That must fail, not pass quietly.
          [ -s "$MAJORS_FILE" ] || { echo "::error::printEsMajors wrote no ES major."; exit 1; }
          # ["9", ...] -> {"include":[{"ES_MAJOR":"9"}, ...]}, the matrix both jobs below read.
          MAJORS=$(awk 'BEGIN { printf "[" } { printf "%s\"%s\"", (NR > 1 ? "," : ""), $0 } END { print "]" }' "$MAJORS_FILE")

          # isPreReleaseVersion prints one word. Configuration-time logging can still reach stdout
          # under -q, so take the last line and refuse anything that is not the answer. A wrong
          # value here would publish a release as a pre-release, or the reverse.
          IS_PRE=$(./gradlew --no-daemon -q isPreReleaseVersion | tail -n 1)
          case "$IS_PRE" in
            true|false) ;;
            *) echo "::error::isPreReleaseVersion printed '$IS_PRE', not true or false."; exit 1 ;;
          esac

          {
            echo "majors_matrix=$(jq -c '{include: map({ES_MAJOR: .})}' <<< "$MAJORS")"
            echo "is_release_version=$([ "$IS_PRE" = true ] && echo false || echo true)"
          } >> "$GITHUB_OUTPUT"

          {
            echo "ES majors: $MAJORS"
            echo "Pre-release: $IS_PRE"
          } >> "$GITHUB_STEP_SUMMARY"

  # ── UPLOAD_PRE_ROR (pre-release versions, automatic path only) ────────────
  # Self-hosted: gradle assembly plus S3/Docker Hub uploads. Long, IO-bound, low
  # concurrency — the shape the ryzen box is good at, and the single largest Ubicloud line item
  # (~3.8k minutes/month). Needs a registered self-hosted runner: see ci/self-hosted-runner.md.
  #
  # The manual path exists to cut a release. A pre-release build belongs to the automatic pipeline.
  upload_pre_ror:
    needs: [ release_setup, discover ]
    if: >-
      needs.discover.outputs.is_release_version == 'false' &&
      github.event_name == 'workflow_run'
    runs-on: &self_hosted_runner [self-hosted, Linux, X64]
    container: *toolchains_container
    timeout-minutes: 600
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.majors_matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { ref: "${{ env.RELEASE_SHA }}", fetch-depth: 1, persist-credentials: false }
      - name: upload_pre_plugins
        env:
          ROR_S3_ENDPOINT_URL: ${{ vars.ROR_S3_ENDPOINT_URL }}
          ROR_S3_REGION: ${{ vars.ROR_S3_REGION }}
          ROR_S3_BUCKET: ${{ vars.ROR_S3_BUCKET }}
          ROR_S3_ACCESS_KEY_ID: ${{ secrets.ROR_S3_ACCESS_KEY_ID }}
          ROR_S3_SECRET_ACCESS_KEY: ${{ secrets.ROR_S3_SECRET_ACCESS_KEY }}
          ROR_S3_PATH_ARTIFACTS: ${{ vars.ROR_S3_PATH_ARTIFACTS }}
          ROR_S3_PATH_LIBS: ${{ vars.ROR_S3_PATH_LIBS }}
          ROR_TASK: upload_pre_plugins
          ES_MAJOR: ${{ matrix.ES_MAJOR }}
          DOCKER_REGISTRY_USER: ${{ secrets.DOCKER_HUB_USER }}
          DOCKER_REGISTRY_PASSWORD: ${{ secrets.DOCKER_HUB_RW_TOKEN }}
        run: |
          set -e
          source ci/configure-docker.sh
          ci/run-pipeline.sh

  # ── RELEASE_ROR (release versions) ────────────────────────────────────────
  # Self-hosted, same reasoning as upload_pre_ror: ~2.2k Ubicloud minutes/month of
  # assembly and upload. See ci/self-hosted-runner.md.
  release_ror:
    needs: [ release_setup, discover ]
    if: needs.discover.outputs.is_release_version == 'true'
    permissions:
      contents: write   # ci-lib.sh tags the release and pushes the tag via the checkout token
    runs-on: *self_hosted_runner
    container: *toolchains_container
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.majors_matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { ref: "${{ env.RELEASE_SHA }}", fetch-depth: 1, persist-credentials: true }
      - name: release_plugins
        env:
          ROR_S3_ENDPOINT_URL: ${{ vars.ROR_S3_ENDPOINT_URL }}
          ROR_S3_REGION: ${{ vars.ROR_S3_REGION }}
          ROR_S3_BUCKET: ${{ vars.ROR_S3_BUCKET }}
          ROR_S3_ACCESS_KEY_ID: ${{ secrets.ROR_S3_ACCESS_KEY_ID }}
          ROR_S3_SECRET_ACCESS_KEY: ${{ secrets.ROR_S3_SECRET_ACCESS_KEY }}
          ROR_S3_PATH_ARTIFACTS: ${{ vars.ROR_S3_PATH_ARTIFACTS }}
          ROR_S3_PATH_LIBS: ${{ vars.ROR_S3_PATH_LIBS }}
          ROR_TASK: release_plugins
          ES_MAJOR: ${{ matrix.ES_MAJOR }}
          DOCKER_REGISTRY_USER: ${{ secrets.DOCKER_HUB_USER }}
          DOCKER_REGISTRY_PASSWORD: ${{ secrets.DOCKER_HUB_RW_TOKEN }}
          # ci-lib.sh still uses this legacy variable name in the release tag message.
          TRAVIS_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -e
          source ci/configure-docker.sh
          ci/run-pipeline.sh

  # ── PUBLISH_MVN_ARTIFACTS (master releases only) ──────────────────────────
  publish_mvn:
    needs: [ release_setup, discover ]
    if: >-
      needs.discover.outputs.is_release_version == 'true' &&
      needs.release_setup.outputs.is_master == 'true'
    runs-on: *self_hosted_runner
    container: *toolchains_container
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { ref: "${{ env.RELEASE_SHA }}", fetch-depth: 1, persist-credentials: false }
      - name: Install PGP signing key
        env:
          PGP_SECRET_KEY_B64: ${{ secrets.PGP_SECRET_KEY_B64 }}
        run: |
          mkdir -p .travis
          # The workspace outlives the job on a persistent runner, and the next checkout only cleans
          # it when the next job starts. Keep the private key unreadable to anything else meanwhile.
          install -m 600 /dev/null .travis/secret.pgp
          echo "$PGP_SECRET_KEY_B64" | base64 -d > .travis/secret.pgp
      - name: publish_maven_artifacts
        env:
          ROR_TASK: publish_maven_artifacts
          MAVEN_REPO_USER: ${{ secrets.MAVEN_REPO_USER }}
          MAVEN_REPO_PASSWORD: ${{ secrets.MAVEN_REPO_PASSWORD }}
          MAVEN_STAGING_PROFILE_ID: ${{ secrets.MAVEN_STAGING_PROFILE_ID }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: ci/run-pipeline.sh
      # An ephemeral VM took the key away with it. This runner does not, so remove it here — also
      # when the publish fails or is cancelled.
      - name: Remove the PGP signing key
        if: always()
        run: rm -f .travis/secret.pgp
