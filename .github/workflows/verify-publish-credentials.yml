name: Verify publish credentials

# The one thing a release cannot do without, checked on a day when nothing is at stake.
#
# publish_mvn runs only when a run is a release, and it skips silently when the current version is
# already published. A rotated, expired or wrong credential is therefore invisible until the run
# that must not fail. Master pushes are too rare to carry this check: over the 62 days GitHub still
# retains runs for, master took 14 pushes, and 12 of them fell inside one 13-day burst of pipeline
# work. For the other 49 days it would not have run once.
#
# So it runs on a clock instead. It publishes nothing and needs no release.

on:
  schedule:
    # 06:00 UTC. Early enough that a broken credential is known before the working day.
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

defaults:
  run:
    shell: bash

jobs:
  sonatype:
    name: Sonatype
    runs-on: ubuntu-latest   # free for public repos; the job is one HTTPS call
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { fetch-depth: 1, persist-credentials: false }
      - name: Free host disk
        run: ci/free-host-disk.sh
      - name: verify_sonatype_credentials
        env:
          MAVEN_REPO_USER: ${{ secrets.MAVEN_REPO_USER }}
          MAVEN_REPO_PASSWORD: ${{ secrets.MAVEN_REPO_PASSWORD }}
          MAVEN_STAGING_PROFILE_ID: ${{ secrets.MAVEN_STAGING_PROFILE_ID }}
        run: ci/verify-sonatype-credentials.sh
      # A scheduled workflow that nobody watches is the failure mode this job exists to remove.
      # An issue costs no new secret and is visible to everyone. Delete this step once a bot
      # reports the workflow to Slack.
      - name: Report the failure where someone will see it
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: ci/report-credential-failure.sh
