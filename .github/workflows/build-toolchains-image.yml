name: Build toolchains image

# Produces the toolchains image of one commit and pushes it to Docker Hub.
# The image holds the JDKs, Gradle and all Gradle dependencies of that commit.
# For the latest develop commit, the image also becomes the develop toolchains image.
# The weekly run rebuilds the develop toolchains image from scratch and deletes images older than 30 days.

on:
  schedule:
    - cron: '0 3 * * 1'   # weekly rebuild
  workflow_dispatch:
    inputs:
      ref:
        description: The branch, tag or commit to build the image for.
        type: string
        default: develop
      full-rebuild:
        description: Build the image again from new base images and an empty Gradle home, even when it exists.
        type: boolean
        default: false
      cleanup:
        description: Delete commit images older than 30 days after the build.
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:

  # ── PLAN ──────────────────────────────────────────────────────────────────
  # The concurrency group of `build` needs the tag, and job-level `concurrency` cannot read a step output.
  plan:
    runs-on: ${{ fromJSON(vars.ES_LIGHT_RUNS_ON || '["ubuntu-latest"]') }}
    timeout-minutes: 10
    outputs:
      commit_tag: ${{ steps.tag.outputs.commit_tag }}
      full_rebuild: ${{ github.event_name == 'schedule' || inputs.full-rebuild }}
      cleanup: ${{ github.event_name == 'schedule' || inputs.cleanup }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { ref: "${{ inputs.ref || 'develop' }}", fetch-depth: 1, persist-credentials: false }
      - id: tag
        run: echo "commit_tag=$(ci/toolchains/toolchains-image.sh commit-tag)" >> "$GITHUB_OUTPUT"

  # ── BUILD ─────────────────────────────────────────────────────────────────
  build:
    needs: plan
    runs-on: ${{ fromJSON(vars.ES_IMAGE_BUILD_RUNS_ON || '["ubuntu-latest"]') }}
    timeout-minutes: 120
    # Two builds of one tag would push it twice. A second run waits, because cancelling one wastes its build.
    concurrency:
      group: toolchains-${{ needs.plan.outputs.commit_tag }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { ref: "${{ inputs.ref || 'develop' }}", fetch-depth: 1, persist-credentials: false }
      - name: Free host disk
        run: ci/free-host-disk.sh
      - name: docker build & push
        env:
          DOCKER_REGISTRY_USER: ${{ secrets.DOCKER_HUB_USER }}
          DOCKER_REGISTRY_PASSWORD: ${{ secrets.DOCKER_HUB_RW_TOKEN }}
        run: ci/toolchains/toolchains-image.sh build ${{ needs.plan.outputs.full_rebuild == 'true' && '--full-rebuild' || '' }}

  # ── CLEANUP ───────────────────────────────────────────────────────────────
  cleanup:
    needs: [plan, build]
    if: needs.plan.outputs.cleanup == 'true'
    runs-on: ${{ fromJSON(vars.ES_LIGHT_RUNS_ON || '["ubuntu-latest"]') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { fetch-depth: 1, persist-credentials: false }
      - name: Delete old toolchains image tags
        env:
          DOCKER_HUB_USER: ${{ secrets.DOCKER_HUB_USER }}
          # The RW token has no Delete scope.
          DOCKER_HUB_DELETE_TOKEN: ${{ secrets.DOCKER_HUB_DELETE_TOKEN }}
        run: ci/toolchains/toolchains-image.sh cleanup
