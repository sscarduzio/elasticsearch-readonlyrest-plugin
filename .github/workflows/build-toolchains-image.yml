name: Build toolchains image

# Builds the deps tag of a ref, and moves the develop tag when the ref is the head of develop.
# The weekly run also rebuilds from fresh base images and deletes old deps tags.

on:
  schedule:
    - cron: '0 3 * * 1'   # weekly rebuild
  workflow_dispatch:
    inputs:
      ref:
        description: The branch, tag or commit to build the image for.
        type: string
        default: develop
      fresh:
        description: Build from fresh base images and an empty Gradle home, then delete old deps tags.
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:

  # ── PLAN ──────────────────────────────────────────────────────────────────
  # The concurrency group of `build` needs the tag, and job-level `concurrency` cannot read a step output.
  plan:
    runs-on: ${{ fromJSON(vars.ES_LIGHT_RUNS_ON || '["ubuntu-latest"]') }}
    timeout-minutes: 10
    outputs:
      deps_tag: ${{ steps.tag.outputs.deps_tag }}
      fresh: ${{ github.event_name == 'schedule' || inputs.fresh }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { ref: "${{ inputs.ref || 'develop' }}", fetch-depth: 1, persist-credentials: false }
      - id: tag
        run: echo "deps_tag=$(ci/toolchains/toolchains-image.sh deps-tag)" >> "$GITHUB_OUTPUT"

  # ── BUILD ─────────────────────────────────────────────────────────────────
  build:
    needs: plan
    runs-on: ${{ fromJSON(vars.ES_IMAGE_BUILD_RUNS_ON || '["ubuntu-latest"]') }}
    timeout-minutes: 120
    # Two builds of one tag would push it twice. A second run waits, because cancelling one wastes its build.
    concurrency:
      group: toolchains-${{ needs.plan.outputs.deps_tag }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { ref: "${{ inputs.ref || 'develop' }}", fetch-depth: 1, persist-credentials: false }
      - name: Free host disk
        run: ci/free-host-disk.sh
      - name: docker build & push
        env:
          DOCKER_REGISTRY_USER: ${{ secrets.DOCKER_HUB_USER }}
          DOCKER_REGISTRY_PASSWORD: ${{ secrets.DOCKER_HUB_RW_TOKEN }}
        run: ci/toolchains/toolchains-image.sh build ${{ needs.plan.outputs.fresh == 'true' && '--fresh' || '' }}

  # ── CLEANUP ───────────────────────────────────────────────────────────────
  cleanup:
    needs: [plan, build]
    if: needs.plan.outputs.fresh == 'true'
    runs-on: ${{ fromJSON(vars.ES_LIGHT_RUNS_ON || '["ubuntu-latest"]') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { fetch-depth: 1, persist-credentials: false }
      - name: Delete old toolchains image tags
        env:
          DOCKER_HUB_USER: ${{ secrets.DOCKER_HUB_USER }}
          # The RW token has no Delete scope.
          DOCKER_HUB_DELETE_TOKEN: ${{ secrets.DOCKER_HUB_DELETE_TOKEN }}
        run: ci/toolchains/toolchains-image.sh cleanup
