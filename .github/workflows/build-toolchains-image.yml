name: Build toolchains image

# Rebuilds the toolchains image of this commit from fresh base images, and deletes old image tags.
# The CI setup job builds a missing image itself (ci/toolchains/ensure-image.sh). This weekly run picks
# up JDK and OS patches. See "The container: image" in ci/CI.md.

on:
  schedule:
    - cron: '0 3 * * 1'   # weekly rebuild
  workflow_dispatch:

# Two rebuilds push the same tags. A second run waits, because cancelling one wastes its build.
concurrency:
  group: build-toolchains-image
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:

  # ── BUILD ─────────────────────────────────────────────────────────────────
  build:
    # A GitHub schedule fires on the default branch. The guard holds if that branch ever changes.
    if: github.event_name != 'schedule' || github.ref == 'refs/heads/develop'
    runs-on: ${{ fromJSON(vars.ES_IMAGE_BUILD_RUNS_ON || '["ubuntu-latest"]') }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { fetch-depth: 1, persist-credentials: false }
      - name: Free host disk
        run: ci/free-host-disk.sh
      - name: docker build & push
        env:
          DOCKER_REGISTRY_USER: ${{ secrets.DOCKER_HUB_USER }}
          DOCKER_REGISTRY_PASSWORD: ${{ secrets.DOCKER_HUB_RW_TOKEN }}
          IS_DEVELOP: ${{ github.ref == 'refs/heads/develop' }}
        run: |
          set -e
          # Source before the build: it logs in, and it sets the mirror of the FROM lines.
          source ci/configure-docker.sh
          . ci/toolchains/image.env
          TAGS=("$(ci/toolchains/image-tag.sh)")
          # TOOLCHAINS_IMAGE follows develop. A fork pull request, which cannot build, takes it.
          [ "$IS_DEVELOP" = true ] && TAGS+=("$TOOLCHAINS_IMAGE")
          echo ">>> Building ${TAGS[*]}"
          echo ">>> Pushed digest: $(ci/toolchains/build-image.sh --fresh "${TAGS[@]}")"

  # ── CLEANUP ───────────────────────────────────────────────────────────────
  cleanup:
    needs: build
    runs-on: ${{ fromJSON(vars.ES_LIGHT_RUNS_ON || '["ubuntu-latest"]') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { fetch-depth: 1, persist-credentials: false }
      - name: Delete old toolchains image tags
        env:
          DOCKER_HUB_USER: ${{ secrets.DOCKER_HUB_USER }}
          # The RW token has no Delete scope. Without this token the step lists the tags only.
          DOCKER_HUB_DELETE_TOKEN: ${{ secrets.DOCKER_HUB_DELETE_TOKEN }}
        run: ci/toolchains/cleanup-tags.sh
