name: Fill Gradle read-only cache

# Saves the Gradle dependencies that the toolchains image lacks, for the CI jobs.
# See "Gradle read-only cache" in ci/CI.md.

on:
  push:
    branches: [ develop, master ]
    paths:
      - '**/*.gradle'
      - '**/gradle.properties'
      - 'gradle/wrapper/gradle-wrapper.properties'
      - 'build-base/src/main/**'
      - 'ci/toolchains/resolve-deps.init.gradle'
      - 'ci/fill-gradle-cache.sh'
      - 'ci/gradle-ro-cache-key.sh'
      - '.github/workflows/fill-gradle-ro-cache.yml'
  # GitHub removes an entry that nothing reads for 7 days. The daily run puts it back.
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:

concurrency:
  group: fill-gradle-ro-cache-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  setup:
    runs-on: ${{ fromJSON(vars.ES_LIGHT_RUNS_ON || '["ubuntu-latest"]') }}
    timeout-minutes: 10
    outputs:
      image: ${{ steps.toolchains.outputs.image }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { fetch-depth: 1, persist-credentials: false }
      - id: toolchains
        uses: ./.github/actions/resolve-toolchains-image

  fill:
    needs: setup
    # The jobs that restore the entry run here, and each runner pool keeps its own cache store.
    runs-on: ${{ fromJSON(vars.ES_CI_RUNS_ON || '["ubuntu-latest"]') }}
    container:
      image: ${{ needs.setup.outputs.image }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { fetch-depth: 1, persist-credentials: false }
      - name: Free host disk
        run: ci/free-host-disk.sh
      - id: key
        run: echo "key=$(ci/gradle-ro-cache-key.sh)" >> "$GITHUB_OUTPUT"
      - id: lookup
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .gradle-ro-cache
          key: ${{ steps.key.outputs.key }}
          lookup-only: true
      - name: Fill
        if: steps.lookup.outputs.cache-hit != 'true'
        run: ci/fill-gradle-cache.sh .gradle-ro-cache
      - if: steps.lookup.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .gradle-ro-cache
          key: ${{ steps.key.outputs.key }}
