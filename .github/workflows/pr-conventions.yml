name: PR Conventions

# Checks the conventions a reviewer used to check by hand: the Jira key in the title, and a changelog
# entry when the change can reach a client. The logic lives in ci/check-pr-conventions.sh so it can be
# run locally before opening the pull request.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize, labeled, unlabeled, ready_for_review]

# A new push or edit makes an in-flight check obsolete.
concurrency:
  group: pr-conventions-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  conventions:
    name: conventions
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      # Check out the BASE branch's copy of the script, not the pull request's: a pull request must not
      # be able to edit the rule it is judged by. Only the script is fetched; everything else the check
      # needs comes from the API.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          sparse-checkout: ci/check-pr-conventions.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Check PR conventions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Only true for the pull request that introduces the check.
          if [ ! -x ci/check-pr-conventions.sh ]; then
            echo "::notice::ci/check-pr-conventions.sh is not on the base branch yet; skipping"
            exit 0
          fi
          ci/check-pr-conventions.sh "${{ github.event.pull_request.number }}"
