name: CI

on:
  push:
    branches: [ master, develop, 'epic/**', '**/epic/**' ]
    paths-ignore:
      - 'docs/**'
      - '.claude/**'
      - '**/*.md'
  pull_request:
    types: [ opened, synchronize, reopened, ready_for_review ]
    branches: [ master, develop, 'epic/**', '**/epic/**' ]
    paths-ignore:
      - 'docs/**'
      - '.claude/**'
      - '**/*.md'
  workflow_dispatch:
    inputs:
      actionToPerform:
        description: '(Manual) action to perform'
        type: choice
        default: run_all_tests_on_linux
        options:
          - run_all_tests_on_linux
          - run_all_tests_on_windows
          - run_e2e_tests

# Cancel superseded PR runs. Branch pushes queue behind the running build so an in-flight release
# is never cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Container jobs default run: steps to `sh`, where `source` (configure-docker.sh) fails with 127.
# Windows jobs are unaffected — their steps declare `shell: pwsh` explicitly.
defaults:
  run:
    shell: bash

env:
  GRADLE_USER_HOME: /opt/gradle-home
  GRADLE_OPTS: '-Dorg.gradle.java.installations.auto-download=false'
  IT_PARALLELISM: '4'

jobs:

  # ── CI_SETUP ──────────────────────────────────────────────────────────────
  # Resolves the toolchains image to pull, and the facts about this run: which branch it is on, and
  # whether an operator started it. They are job outputs, and not workflow `env`, because a
  # job-level `if:` cannot read the `env` context. An output is a string: a reader compares a flag
  # against 'true', and `manual_action` against an action name.
  ci_setup:
    runs-on: ubuntu-latest
    outputs:
      image:                      ${{ steps.toolchains.outputs.image }}
      is_release_branch:          ${{ steps.flags.outputs.is_release_branch }}
      is_epic_branch:             ${{ steps.flags.outputs.is_epic_branch }}
      is_merge_back:              ${{ steps.flags.outputs.is_merge_back }}
      is_automatic_run:           ${{ steps.flags.outputs.is_automatic_run }}
      manual_action:              ${{ steps.flags.outputs.manual_action }}
      unique_build_id:            ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { fetch-depth: 1, persist-credentials: false }
      - id: toolchains
        uses: ./.github/actions/resolve-toolchains-image
      - id: flags
        env:
          IS_RELEASE_BRANCH: ${{ github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/master' }}
          IS_EPIC_BRANCH: ${{ contains(github.head_ref || github.ref_name, 'epic/') }}
          MANUAL_ACTION: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.actionToPerform || '' }}
        run: |
          # ci-lib.sh owns the merge-back test: same tree as master's tip, and a -pre version.
          source ci/ci-lib.sh
          MERGE_BACK=false
          [ "$IS_RELEASE_BRANCH" = "true" ] && [ -z "$MANUAL_ACTION" ] \
            && is_merge_back_of_master && MERGE_BACK=true
          {
            echo "is_release_branch=$IS_RELEASE_BRANCH"
            echo "is_epic_branch=$IS_EPIC_BRANCH"
            echo "manual_action=$MANUAL_ACTION"
            echo "is_automatic_run=$([ -z "$MANUAL_ACTION" ] && echo true || echo false)"
            echo "is_merge_back=$MERGE_BACK"
          } >> "$GITHUB_OUTPUT"

  # ── TOOLCHAINS_VERIFY ─────────────────────────────────────────────────────
  # Fails fast when the toolchains image is broken: one cheap job runs the checks that every heavy
  # job depends on. See .github/actions/verify-toolchains-image.
  toolchains_verify:
    needs: ci_setup
    runs-on: ubuntu-latest
    container: &toolchains_container
      image: ${{ needs.ci_setup.outputs.image }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { fetch-depth: 1, persist-credentials: false }
      - uses: ./.github/actions/verify-toolchains-image

  # ── DISCOVER ──────────────────────────────────────────────────────────────
  # Picks the work of this run: which ES majors get a plugin build, and which ES modules the Linux,
  # Windows and E2E tests cover. TestMatrixPolicy (build-base) holds the rules, so a new ES module
  # joins every matrix without an edit here.
  discover:
    needs: [ ci_setup, toolchains_verify ]
    runs-on: ubuntu-latest
    container: *toolchains_container
    timeout-minutes: 15
    outputs:
      build_matrix:      ${{ steps.matrices.outputs.build }}
      it_linux_matrix:   ${{ steps.matrices.outputs.linux }}
      it_windows_matrix: ${{ steps.matrices.outputs.windows }}
      e2e_matrix:        ${{ steps.matrices.outputs.e2e }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { fetch-depth: 1, persist-credentials: false }
        # One gradle call for both tasks. Each writes its answer to a file under build/
      - name: Derive the ES majors and the test matrices
        run: ./gradlew --no-daemon -q printEsMajors printTestMatrices
      - id: matrices
        env:
          IS_RELEASE_BRANCH: ${{ needs.ci_setup.outputs.is_release_branch }}
          IS_EPIC_BRANCH: ${{ needs.ci_setup.outputs.is_epic_branch }}
          IS_PR_DRAFT: ${{ github.event.pull_request.draft == true }}
          IS_MERGE_BACK: ${{ needs.ci_setup.outputs.is_merge_back }}
          MANUAL_RUN_ACTION: ${{ needs.ci_setup.outputs.manual_action }}
        run: |
          set -e

          read_modules() {
            local file=build/ci-matrices/$1.json
            [ -s "$file" ] || { echo "::error::printTestMatrices wrote no $1 matrix." >&2; return 1; }
            cat "$file"
          }

          # ["es94x", ...] -> {"include":[{"ES_MODULE":"es94x"}, ...]}, the matrix each leg reads.
          as_matrix() { jq -c --arg key "$1" '{include: map({($key): .})}' <<< "$2"; }

          # Did the operator choose this action? No automatic run matches.
          is_action_chosen() { [ "$MANUAL_RUN_ACTION" = "$1" ]; }

          # Is this action selected for the run? An automatic run selects every action, a manual
          # run only the chosen one.
          is_action_selected() { [ -z "$MANUAL_RUN_ACTION" ] || is_action_chosen "$1"; }

          MAJORS_FILE=build/es-modules/es-majors.txt
          [ -s "$MAJORS_FILE" ] || { echo "::error::printEsMajors wrote no ES major."; exit 1; }
          MAJORS=$(awk 'BEGIN { printf "[" } { printf "%s\"%s\"", (NR > 1 ? "," : ""), $0 } END { print "]" }' "$MAJORS_FILE")

          if ! is_action_selected run_all_tests_on_linux; then
            LINUX='[]'
          elif [ "$IS_PR_DRAFT" = "true" ]; then
            LINUX=$(read_modules linux_it_pr_draft)
          elif [ "$IS_MERGE_BACK" = "true" ]; then
            LINUX=$(read_modules linux_it_pr_ready)
          elif is_action_chosen run_all_tests_on_linux; then
            LINUX=$(read_modules linux_it_full)
          elif [ "$IS_RELEASE_BRANCH" = "true" ]; then
            LINUX=$(read_modules linux_it_full)
          elif [ "$IS_EPIC_BRANCH" = "true" ]; then
            LINUX=$(read_modules linux_it_full)
          else
            LINUX=$(read_modules linux_it_pr_ready)
          fi

          if ! is_action_selected run_all_tests_on_windows; then
            WINDOWS='[]'
          elif [ "$IS_PR_DRAFT" = "true" ]; then
            WINDOWS='[]'
          elif [ "$IS_MERGE_BACK" = "true" ]; then
            WINDOWS=$(read_modules win_it_pr_ready)
          elif is_action_chosen run_all_tests_on_windows; then
            WINDOWS=$(read_modules win_it_full)
          elif [ "$IS_RELEASE_BRANCH" = "true" ]; then
            WINDOWS=$(read_modules win_it_master_or_develop)
          elif [ "$IS_EPIC_BRANCH" = "true" ]; then
            WINDOWS=$(read_modules win_it_master_or_develop)
          else
            WINDOWS=$(read_modules win_it_pr_ready)
          fi

          if ! is_action_selected run_e2e_tests; then
            E2E='[]'
          elif [ "$IS_PR_DRAFT" = "true" ]; then
            E2E='[]'
          else
            E2E=$(read_modules e2e_full)
          fi

          {
            echo "build=$(as_matrix ES_MAJOR "$MAJORS")"
            echo "linux=$(as_matrix ES_MODULE "$LINUX")"
            echo "windows=$(as_matrix ES_MODULE "$WINDOWS")"
            echo "e2e=$(as_matrix ES_MODULE "$E2E")"
          } >> "$GITHUB_OUTPUT"

          {
            echo "ES majors: $MAJORS"
            echo "Linux IT: $LINUX"
            echo "Windows IT: $WINDOWS"
            echo "E2E: $E2E"
          } >> "$GITHUB_STEP_SUMMARY"

  # ── OPTIONAL_CHECKS: CVE (non-blocking) ───────────────────────────────────
  # Failures annotate the run but never block it. Matrix for symmetry with required_checks;
  optional_checks:
    name: ${{ matrix.OPTIONAL_CHECK }}
    needs: [ ci_setup, toolchains_verify ]
    if: needs.ci_setup.outputs.is_automatic_run == 'true'
    runs-on: ubuntu-latest
    container: *toolchains_container
    continue-on-error: true
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        OPTIONAL_CHECK: [ cve_check ]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { fetch-depth: 1, persist-credentials: false }
      - name: Free host disk
        run: ci/free-host-disk.sh
      - name: ${{ matrix.OPTIONAL_CHECK }}
        uses: ./.github/actions/cve-check
        with:
          # The caller decides who writes the NVD database cache. Pushes to develop and to master
          # occur often, and thus keep the cache fresh. A PR run only reads the cache.
          save-nvd-cache: >-
            ${{ github.event_name == 'push' &&
                needs.ci_setup.outputs.is_release_branch == 'true' }}
          nvd-api-key: ${{ secrets.NVD_API_KEY }}
          oss-index-username: ${{ secrets.OSS_INDEX_USERNAME }}
          oss-index-password: ${{ secrets.OSS_INDEX_PASSWORD }}

  # ── REQUIRED_CHECKS ───────────────────────────────────────────────────────
  required_checks:
    name: ${{ matrix.REQUIRED_CHECK }}
    needs: [ ci_setup, toolchains_verify ]
    if: needs.ci_setup.outputs.is_automatic_run == 'true'
    runs-on: ubuntu-latest
    container: *toolchains_container
    strategy:
      fail-fast: false
      matrix:
        REQUIRED_CHECK: [ license_check, compile_codebase_check, audit_build_check, format_code_check ]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { fetch-depth: 1, persist-credentials: false }
      - name: Free host disk
        run: ci/free-host-disk.sh
      - name: ${{ matrix.REQUIRED_CHECK }}
        env:
          ROR_TASK: ${{ matrix.REQUIRED_CHECK }}
          ROR_S3_ENDPOINT_URL: ${{ vars.ROR_S3_ENDPOINT_URL }}
          ROR_S3_REGION: ${{ vars.ROR_S3_REGION }}
          ROR_S3_BUCKET: ${{ vars.ROR_S3_BUCKET }}
          ROR_S3_ACCESS_KEY_ID: ${{ secrets.ROR_S3_ACCESS_KEY_ID }}
          ROR_S3_SECRET_ACCESS_KEY: ${{ secrets.ROR_S3_SECRET_ACCESS_KEY }}
          ROR_S3_PATH_LIBS: ${{ vars.ROR_S3_PATH_LIBS }}
        run: ci/run-pipeline.sh

  # ── TEST: unit (Linux) ────────────────────────────────────────────────────
  unit_tests_linux:
    needs: [ ci_setup, toolchains_verify ]
    if: >-
      needs.ci_setup.outputs.is_automatic_run == 'true' ||
      needs.ci_setup.outputs.manual_action == 'run_all_tests_on_linux'
    runs-on: ubuntu-latest
    container: *toolchains_container
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { fetch-depth: 1, persist-credentials: false }
      - name: Free host disk
        run: ci/free-host-disk.sh
      - name: core_tests
        env:
          ROR_TASK: core_tests
          DOCKER_REGISTRY_USER: ${{ secrets.DOCKER_HUB_USER }}
          DOCKER_REGISTRY_PASSWORD: ${{ secrets.DOCKER_HUB_RO_TOKEN }}
        run: |
          source ci/configure-docker.sh
          ci/run-pipeline.sh
      - name: Publish test results
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: unit-test-results
          path: '**/TEST*.xml'
          if-no-files-found: ignore

  # ── TEST: Linux integration tests (GitHub-hosted) ─────────────────────────
  it_linux:
    name: it_linux_${{ matrix.ES_MODULE }}
    needs: [ discover, ci_setup, toolchains_verify ]
    runs-on: ubuntu-latest
    container: *toolchains_container
    timeout-minutes: 120
    env:
      ROR_CI_JOB_ID: ${{ github.run_id }}-${{ strategy.job-index }}
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.discover.outputs.it_linux_matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { fetch-depth: 1, persist-credentials: false }
      - name: Free host disk (no-op on self-hosted)
        run: ci/free-host-disk.sh
      - name: Start memory telemetry
        uses: ./.github/actions/mem-telemetry-start
        with:
          id: ${{ matrix.ES_MODULE }}
          log-dir: integration-tests/build
      - name: integration_${{ matrix.ES_MODULE }}
        env:
          # The pipeline task name run-pipeline.sh dispatches on — unchanged, only the matrix now
          # carries the bare module (see discover).
          ROR_TASK: integration_${{ matrix.ES_MODULE }}
          # Balanced (level) shard packing + the memory gate that makes it survivable on 16GB.
          # 2 permits, not 3: at k=4 with 3 permits the worst case (3 heavies x 3 nodes + a
          # single-node suite + 4 gradle JVMs) grazes 16GB and host-OOM'd es90x — and balanced
          # packing schedules the heaviest suites first, so that worst case happens at minute one.
          # es94x tolerated 3 only because it excludes some of the heavy suites other modules run.
          ROR_BALANCED_SHARDS: 'true'
          ROR_HEAVY_SUITE_PERMITS: '2'
          # the JDWP agent costs ~90MB RSS per ES container and nothing attaches to it in CI
          ROR_ES_JDWP: 'false'
          ROR_S3_ENDPOINT_URL: ${{ vars.ROR_S3_ENDPOINT_URL }}
          ROR_S3_REGION: ${{ vars.ROR_S3_REGION }}
          ROR_S3_BUCKET: ${{ vars.ROR_S3_BUCKET }}
          ROR_S3_ACCESS_KEY_ID: ${{ secrets.ROR_S3_ACCESS_KEY_ID }}
          ROR_S3_SECRET_ACCESS_KEY: ${{ secrets.ROR_S3_SECRET_ACCESS_KEY }}
          ROR_S3_PATH_LIBS: ${{ vars.ROR_S3_PATH_LIBS }}
          DOCKER_REGISTRY_USER: ${{ secrets.DOCKER_HUB_USER }}
          DOCKER_REGISTRY_PASSWORD: ${{ secrets.DOCKER_HUB_RO_TOKEN }}
        run: |
          source ci/configure-docker.sh
          ci/run-pipeline.sh
      - name: Publish test results
        # always(): green-run XMLs feed suite-timings.json regeneration (duration-balanced sharding)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: it-linux-${{ matrix.ES_MODULE }}-results
          path: '**/TEST*.xml'
          if-no-files-found: ignore
      - name: Shard logs (browsable)
        if: always()
        run: |
          for f in integration-tests/build/sharded-logs/shard-*.log; do
            [ -f "$f" ] || continue
            echo "::group::$(basename "$f")"
            cat "$f"
            echo "::endgroup::"
          done
      - name: Memory telemetry report
        if: always()
        uses: ./.github/actions/mem-telemetry-report
        with:
          id: ${{ matrix.ES_MODULE }}
          log-dir: integration-tests/build
      - name: Suite-timings drift check
        if: always() && matrix.ES_MODULE == 'es90x'
        run: ./gradlew integration-tests:regenerateSuiteTimings || true
      - name: Publish regenerated suite timings
        if: always() && matrix.ES_MODULE == 'es90x'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: suite-timings-regenerated
          path: integration-tests/build/suite-timings-regenerated.json
          if-no-files-found: ignore
      - name: Publish per-shard logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sharded-logs-it-linux-${{ matrix.ES_MODULE }}
          path: integration-tests/build/sharded-logs/
          if-no-files-found: ignore


  # ── TEST: Windows integration tests (GitHub-hosted) ───────────────────────
  it_windows:
    # "it_win_es94x", not the truncated "it_windows (es94x)" composite, in the graph view. Same
    # <leg>_<module> shape as it_linux_* and e2e_*, so the three test legs sort together.
    name: it_win_${{ matrix.ES_MODULE }}
    # toolchains_verify is in needs even though Windows doesn't use the image, so a broken image
    # fails fast instead of running doomed legs.
    needs: [ discover, toolchains_verify ]
    runs-on: windows-2025
    timeout-minutes: 150
    # Clear the Linux toolchains-image Gradle settings at job scope; the workflow-level
    # GRADLE_USER_HOME=/opt/gradle-home would otherwise leak into gradlew here.
    env:
      GRADLE_USER_HOME: ''
      GRADLE_OPTS: ''
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix: ${{ fromJSON(needs.discover.outputs.it_windows_matrix) }}
    steps:
      - name: Exclude workspace from Windows Defender
        shell: pwsh
        # Real-time AV scanning taxes every file write; our tests write hundreds of thousands
        # (ES unzips, node data dirs). Standard CI mitigation; runner VMs are ephemeral.
        run: |
          Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE"
          Add-MpPreference -ExclusionPath "$env:RUNNER_TEMP"
          Add-MpPreference -ExclusionProcess "java.exe"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { fetch-depth: 1, persist-credentials: false }
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with: { distribution: temurin, java-version: '21' }
      # Windows has no baked toolchains image: without this every leg cold-downloads the wrapper,
      # deps + JDKs and cold-compiles Scala (~9 min). Develop runs write the cache; PRs read it.
      # jdks: not in the action's default include set, but auto-download=true provisions there.
      - uses: gradle/actions/setup-gradle@da187c8e6ffbd3802e00f2477aa5a822b25f2dda
        with:
          gradle-home-cache-includes: |
            caches
            notifications
            jdks
      - name: ${{ matrix.ES_MODULE }}
        shell: pwsh
        env:
          ROR_S3_ENDPOINT_URL: ${{ vars.ROR_S3_ENDPOINT_URL }}
          ROR_S3_REGION: ${{ vars.ROR_S3_REGION }}
          ROR_S3_BUCKET: ${{ vars.ROR_S3_BUCKET }}
          ROR_S3_ACCESS_KEY_ID: ${{ secrets.ROR_S3_ACCESS_KEY_ID }}
          ROR_S3_SECRET_ACCESS_KEY: ${{ secrets.ROR_S3_SECRET_ACCESS_KEY }}
          ROR_S3_PATH_LIBS: ${{ vars.ROR_S3_PATH_LIBS }}
          ES_MODULE: ${{ matrix.ES_MODULE }}
          # level packing (the random split gave 15/29/23 suites) + memory gate for native-ES spikes
          ROR_BALANCED_SHARDS: 'true'
          ROR_HEAVY_SUITE_PERMITS: '2'
        run: |
          # Override the Linux gradle.properties installations.paths and let Windows auto-provision JDKs.
          # Sharded (3 workers) — same trick as the Linux legs; ES runs as native processes on
          # Windows (no docker), 3 fit the 16GB box. 4 workers measured no faster (CPU-bound).
          # ror-tools:test is NOT run per-leg: it took ~10 min/leg and every node install already
          # exercises the patcher end-to-end; the suite still runs via unit_tests_windows.
          # Cap the orchestrator heap for the same reason as the Linux legs (RORDEV-2156): it only
          # spawns the shard processes, but without this it inherits gradle.properties' -Xmx6144m,
          # on a 16GB box that already holds 3 shard JVMs, 3 test workers and 3 native ES nodes.
          $gradleArgs = "--no-daemon", "--build-cache", "integration-tests:shardedTest", "-PshardCount=3", "-PesModule=$env:ES_MODULE",
            "-Dorg.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m",
            "-Dorg.gradle.java.installations.paths=", "-Dorg.gradle.java.installations.auto-download=true"
          .\gradlew @gradleArgs
          if ($LASTEXITCODE -ne 0) {
            Get-ChildItem -Recurse -Filter *hs_err* | ForEach-Object { Get-Content $_.FullName }
            exit 1
          }
      - name: Publish test results
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: it-win-${{ matrix.ES_MODULE }}-results
          path: '**/TEST*.xml'
          if-no-files-found: ignore
      - name: Shard logs (browsable)
        if: always()
        shell: pwsh
        run: |
          Get-ChildItem integration-tests/build/sharded-logs -Filter shard-*.log -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Output "::group::$($_.Name)"
            Get-Content $_.FullName
            Write-Output "::endgroup::"
          }
      - name: Publish per-shard logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sharded-logs-it-win-${{ matrix.ES_MODULE }}
          path: integration-tests/build/sharded-logs/
          if-no-files-found: ignore


  # ── TEST: unit tests on Windows (manual run_all_tests_on_windows only) ────
  unit_tests_windows:
    # ci_setup is in needs only to read the chosen action; this job uses no toolchains image.
    needs: ci_setup
    # By name, not through a flag: no automatic run may start this job, and every other manual
    # action leaves it out.
    if: needs.ci_setup.outputs.manual_action == 'run_all_tests_on_windows'
    runs-on: windows-2025
    timeout-minutes: 150
    env:
      GRADLE_USER_HOME: ''
      GRADLE_OPTS: ''
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { fetch-depth: 1, persist-credentials: false }
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with: { distribution: temurin, java-version: '21' }
      - name: core:test on Windows
        shell: pwsh
        run: |
          .\gradlew --no-daemon core:test ror-tools:test "-PesModule=es94x" `
            "-Dorg.gradle.java.installations.paths=" `
            "-Dorg.gradle.java.installations.auto-download=true"
          if ($LASTEXITCODE -ne 0) {
            Get-ChildItem -Recurse -Filter *hs_err* | ForEach-Object { Get-Content $_.FullName }
            exit 1
          }
      - name: Publish test results
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: win-unit-test-results
          path: '**/TEST*.xml'
          if-no-files-found: ignore

  # ── E2E_ORDER_KBN_IMAGES (the other repo's build) ─────────────────────────
  # The ROR KBN repo builds the ROR KBN images. This job orders that build for all versions, then
  # waits for it. Both steps run in one shell, because only the shell that ordered a build can find
  # its run.
  #
  # A failed ROR KBN build fails THIS job, not a test job. "Re-run failed jobs" then places a new
  # order. e2e_build_es_images builds the ES images while this job waits.
  e2e_order_kbn_images:
    needs: discover
    # An empty matrix is how discover says "no e2e in this run". This job has no matrix of its own
    # for GitHub to skip, so it tests the value here. A failed or skipped discover publishes '',
    # which is not the empty matrix either, hence the result check.
    if: >-
      needs.discover.result == 'success' &&
      needs.discover.outputs.e2e_matrix != '{"include":[]}'
    runs-on: ubuntu-latest
    # Backstop only. The wait below stops first (120 min) and prints the cause.
    # Keep 30 min between the two numbers. Raise both together.
    timeout-minutes: 150
    # This job runs no container, so the toolchains-image Gradle home does not exist here.
    env:
      GRADLE_USER_HOME: ${{ github.workspace }}/.gradle-home
      GRADLE_OPTS: '-Dorg.gradle.java.installations.paths= -Dorg.gradle.java.installations.auto-download=true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { fetch-depth: 1, persist-credentials: false }
      - name: Free host disk
        run: ci/free-host-disk.sh
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with: { distribution: temurin, java-version: '17' }
      # One dispatch covers every version, so this job needs them all before it starts. The other
      # e2e jobs resolve their own, one per matrix row.
      - name: Resolve the ELK version of every e2e module
        id: versions
        env:
          E2E_ES_MODULES: ${{ join(fromJSON(needs.discover.outputs.e2e_matrix).include.*.ES_MODULE, ' ') }}
        run: |
          set -e
          source ci/e2e-tests-lib.sh
          VERSIONS=""
          for module in $E2E_ES_MODULES; do
            # `|| exit $?` is not decoration: `set -e` does not fire for a failed assignment inside
            # a command substitution, so without it a failed lookup would add an empty version.
            version=$(e2e_elk_version_for_module "$module") || exit $?
            echo ">>> $module -> ELK $version"
            VERSIONS="${VERSIONS:+$VERSIONS }$version"
          done
          echo "elk_versions=$VERSIONS" >> "$GITHUB_OUTPUT"
      - name: order_e2e_kbn_images
        id: order
        env:
          ROR_TASK: order_e2e_kbn_images
          E2E_ELK_VERSIONS: ${{ steps.versions.outputs.elk_versions }}
          ROR_KBN_TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
          ROR_KBN_FALLBACK_BRANCH: ${{ github.base_ref || github.ref_name }}
          E2E_BUILD_ID: ${{ needs.ci_setup.outputs.unique_build_id }}
          ROR_GH_TOKEN: ${{ secrets.ROR_GH_TOKEN }}
          # How long to wait for the whole ROR KBN order. Keep it below timeout-minutes above.
          ROR_KBN_WAIT_TIMEOUT_SECONDS: 7200
          DOCKER_REGISTRY_USER: ${{ secrets.DOCKER_HUB_USER }}
          DOCKER_REGISTRY_PASSWORD: ${{ secrets.DOCKER_HUB_RW_TOKEN }}
        run: |
          set -e
          source ci/configure-docker.sh
          ci/run-pipeline.sh

  # ── E2E_BUILD_ES_IMAGES (this repo's build) ───────────────────────────────
  # Builds and publishes this repo's ROR ES dev image. One job per module, under the per-run tag.
  # It runs at the same time as e2e_order_kbn_images.
  e2e_build_es_images:
    name: build_es_${{ matrix.ES_MODULE }}
    needs: [ ci_setup, discover ]
    # No condition: this job fans out over the e2e matrix, and GitHub skips a job whose include
    # list is empty. Same as it_linux and it_windows.
    runs-on: ubuntu-latest   # free for public repos (4cpu/16GB)
    timeout-minutes: 120
    env:
      GRADLE_USER_HOME: ${{ github.workspace }}/.gradle-home
      GRADLE_OPTS: '-Dorg.gradle.java.installations.paths= -Dorg.gradle.java.installations.auto-download=true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.e2e_matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { fetch-depth: 1, persist-credentials: false }
      - name: Free host disk (no-op on self-hosted)
        run: ci/free-host-disk.sh
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with: { distribution: temurin, java-version: '17' }
      - name: build_e2e_es_image
        env:
          ROR_TASK: build_e2e_es_image
          # No ELK version here: run-pipeline.sh derives it from the module, with the Gradle this
          # job already sets up.
          E2E_ES_MODULE: ${{ matrix.ES_MODULE }}
          E2E_BUILD_ID: ${{ needs.ci_setup.outputs.unique_build_id }}
          DOCKER_REGISTRY_USER: ${{ secrets.DOCKER_HUB_USER }}
          DOCKER_REGISTRY_PASSWORD: ${{ secrets.DOCKER_HUB_RW_TOKEN }}
        run: |
          set -e
          source ci/configure-docker.sh
          ci/run-pipeline.sh

  # ── E2E_TESTS (docker env) ────────────────────────────────────────────────
  # Cypress e2e suite, one job per module. Both dev images are already in the registry:
  # e2e_order_kbn_images checked the ROR KBN one, e2e_build_es_images published the ROR ES one.
  # Each job starts the stack and runs the suite. See ci/e2e-tests-lib.sh.
  e2e_tests:
    name: e2e_${{ matrix.ES_MODULE }}
    # No condition either. The empty matrix skips this job, and the default rule — every `needs`
    # job must succeed — covers the rest: a skipped or failed image job leaves the tests out.
    needs: [ ci_setup, discover, e2e_order_kbn_images, e2e_build_es_images ]
    runs-on: ubuntu-latest   # free for public repos (4cpu/16GB)
    timeout-minutes: 120
    # This job runs no container, so the toolchains-image Gradle home does not exist here. Gradle
    # runs once, to derive the ELK version of this row's module.
    env:
      GRADLE_USER_HOME: ${{ github.workspace }}/.gradle-home
      GRADLE_OPTS: '-Dorg.gradle.java.installations.paths= -Dorg.gradle.java.installations.auto-download=true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.e2e_matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { fetch-depth: 1, persist-credentials: false }
      - name: Free host disk (no-op on self-hosted)
        run: ci/free-host-disk.sh
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: '24.11.0' }
      # run_e2e_tests derives E2E_ELK_VERSION from the module, and that is a Gradle call.
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with: { distribution: temurin, java-version: '17' }
      - name: run_e2e_tests
        env:
          ROR_TASK: run_e2e_tests
          E2E_ES_MODULE: ${{ matrix.ES_MODULE }}
          E2E_TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
          E2E_FALLBACK_BRANCH: ${{ github.base_ref || github.ref_name }}
          E2E_BUILD_ID: ${{ needs.ci_setup.outputs.unique_build_id }}
          ROR_ACTIVATION_KEY: ${{ secrets.ROR_ENT_ACTIVATION_TOKEN }}
          ROR_GH_TOKEN: ${{ secrets.ROR_GH_TOKEN }}
          DOCKER_REGISTRY_USER: ${{ secrets.DOCKER_HUB_USER }}
          DOCKER_REGISTRY_PASSWORD: ${{ secrets.DOCKER_HUB_RW_TOKEN }}
          # Do not let corepack ask before it downloads yarn. CI has no operator.
          COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
        run: |
          set -e
           # The e2e repo pins yarn in "packageManager". Corepack reads and uses that.
          corepack enable
          source ci/configure-docker.sh
          echo "[E2E_TESTS] executing ROR_TASK = $ROR_TASK for module $E2E_ES_MODULE"
          ci/run-pipeline.sh

      # Upload test videos/screenshots to S3 (not GitHub artifacts, to save the Actions quota).
      # E2E_TESTS_DIR and E2E_ELK_VERSION are set by run_e2e_tests.
      - name: Upload Cypress artifacts to S3 on failure
        if: failure()
        continue-on-error: true
        # One S3 credential set serves every store; only the path prefix differs per store.
        env:
          ROR_S3_ENDPOINT_URL: ${{ vars.ROR_S3_ENDPOINT_URL }}
          ROR_S3_REGION: ${{ vars.ROR_S3_REGION }}
          ROR_S3_BUCKET: ${{ vars.ROR_S3_BUCKET }}
          ROR_S3_ACCESS_KEY_ID: ${{ secrets.ROR_S3_ACCESS_KEY_ID }}
          ROR_S3_SECRET_ACCESS_KEY: ${{ secrets.ROR_S3_SECRET_ACCESS_KEY }}
          ROR_S3_PATH_E2E_REPORTS: ${{ vars.ROR_S3_PATH_E2E_REPORTS }}
        run: |
          set -e
          # Path layout: <PATH_PREFIX>/YYYY-MM-DD/build_<run id>/<module>_<elk>/<videos|screenshots>
          # Do not hardcode PATH_PREFIX — it is already set. The date sorts reports chronologically.
          BASE="${ROR_S3_PATH_E2E_REPORTS:+${ROR_S3_PATH_E2E_REPORTS%/}/}"
          export ROR_S3_PATH_E2E_REPORTS="${BASE}$(date -u +%Y-%m-%d)/build_${{ github.run_id }}"
          ci/upload-cypress-artifacts-to-s3.sh \
            "${E2E_TESTS_DIR:?run_e2e_tests did not publish the e2e clone path}/results" \
            "${{ matrix.ES_MODULE }}_${E2E_ELK_VERSION:?run_e2e_tests did not publish the ELK version}"

  # ── BUILD_ROR (PR only) ───────────────────────────────────────────────────
  # it_windows and the e2e jobs may legitimately not run: a draft PR gets a reduced Windows matrix
  # and no e2e at all. A failed e2e job also leaves e2e_tests 'skipped', and that must still block
  # this job — hence the e2e clause reads e2e_build_es_images, which is skipped only when the e2e
  # matrix was empty. Every e2e failure path leaves it 'success' or 'failure' instead.
  build_ror:
    # discover supplies the majors, so a new major needs no edit here. The name must stay
    # what it renders today ("build_es9xx"). These are required checks. A renamed check does not
    # block a merge.
    name: build_es${{ matrix.ES_MAJOR }}xx
    needs: [ ci_setup, discover, required_checks, unit_tests_linux, it_linux, it_windows,
             e2e_build_es_images, e2e_tests ]
    if: >-
      !cancelled() &&
      github.event_name == 'pull_request' &&
      needs.required_checks.result == 'success' &&
      needs.unit_tests_linux.result == 'success' &&
      needs.it_linux.result == 'success' &&
      (needs.it_windows.result == 'success' || needs.it_windows.result == 'skipped') &&
      (needs.e2e_tests.result == 'success' || needs.e2e_build_es_images.result == 'skipped')
    # Gradle deps are baked into the toolchains image, so no runner-side cache is needed.
    runs-on: ubuntu-latest   # free for public repos (4cpu/16GB)
    container: *toolchains_container
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.build_matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { fetch-depth: 1, persist-credentials: false }
      - name: build_plugins
        env:
          ROR_TASK: build_plugins
          ES_MAJOR: ${{ matrix.ES_MAJOR }}
        run: ci/run-pipeline.sh
      # An ephemeral VM took the key away with it. This runner does not, so remove it here — also
      # when the publish fails or is cancelled.
      - name: Remove the PGP signing key
        if: always()
        run: rm -f .travis/secret.pgp
