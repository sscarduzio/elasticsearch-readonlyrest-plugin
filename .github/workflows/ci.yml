name: CI

on:
  push:
    branches: [ master, develop, 'epic/**', '**/epic/**' ]
    paths-ignore:
      - 'docs/**'
      - '.claude/**'
      - '**/*.md'
  pull_request:
    # Draft PRs run a reduced test matrix, so marking a draft "ready for review" must start a run
    # with the full PR matrix. That only happens if ready_for_review is listed here — it is not
    # part of the default trigger types (opened, synchronize, reopened).
    types: [ opened, synchronize, reopened, ready_for_review ]
    branches: [ master, develop, 'epic/**', '**/epic/**' ]
    paths-ignore:
      - 'docs/**'
      - '.claude/**'
      - '**/*.md'
  workflow_dispatch:
    inputs:
      actionToPerform:
        description: '(Manual) action to perform'
        type: choice
        default: run_all_tests_on_linux
        options:
          - run_all_tests_on_linux
          - run_all_tests_on_windows
          - run_e2e_tests

# Cancel superseded PR runs. Branch pushes queue behind the running build so an in-flight release
# is never cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Container jobs default run: steps to `sh`, where `source` (configure-docker.sh) fails with 127.
# Windows jobs are unaffected — their steps declare `shell: pwsh` explicitly.
defaults:
  run:
    shell: bash

env:
  # TOOLCHAINS_IMAGE is not here. It lives in ci/toolchains/image.env, which the two jobs that
  # need it source. One file holds the tag, and every workflow reads that file.
  GRADLE_USER_HOME: /opt/gradle-home
  GRADLE_OPTS: '-Dorg.gradle.java.installations.auto-download=false'
  # 4 shards per leg + HeavySuiteGate (max 2 concurrent multi-cluster suites, machine-wide).
  # k=5 was measured faster on es94x (20.6 vs ~21.3 min) but host-OOM'd 4 of 10 modules on the
  # full-matrix run (es80x/es810x/es818x/es90x, exit 137) — those legs run suites es94x excludes,
  # so their memory peaks are higher. Fleet wall time is set by the slowest leg anyway: k=4.
  IT_PARALLELISM: '4'
  AGENT_ISSELFHOSTED: '1'

jobs:

  # ── CI_SETUP ──────────────────────────────────────────────────────────────
  # The two facts every later job asks for: which image to pull, and what kind of run this is.
  #
  # The image. ci/resolve-toolchains-image.sh chooses between the mirror and Docker Hub, so the name
  # is not a constant. The work lives in .github/actions/resolve-toolchains-image, which
  # manual-release.yml also uses. This job holds no container, and it cannot hold one: it is the job
  # that picks it. A runner pulls a container: image before step 1, so a job cannot resolve its own.
  #
  # The run flags. A job-level `if:` cannot read the `env` context, so a predicate that more than one
  # job asks about has to be a job output. Each is named for what it gates, and none of them is a
  # synonym of another: the full matrix also covers epic/**, a release covers develop and master,
  # and Maven publishing covers master alone; a test family runs on every automatic run plus the one
  # manual action that asks for it, while a manual-only job matches no automatic run at all.
  # ci/CI.md holds the table.
  #
  # Every job `if:` reads one of these and compares it against the string 'true'. An output is a
  # string, so the bare value is also truthy when it holds "false".
  ci_setup:
    runs-on: ubuntu-latest   # trivial job; GH-hosted so it runs even if the Ubicloud app is down
    outputs:
      image:                      ${{ steps.toolchains.outputs.image }}
      # Which branch this is.
      is_full_matrix:             ${{ steps.flags.outputs.is_full_matrix }}
      is_release_branch:          ${{ steps.flags.outputs.is_release_branch }}
      # What kind of run this is.
      is_automatic_run:           ${{ steps.flags.outputs.is_automatic_run }}
      runs_linux_tests:           ${{ steps.flags.outputs.runs_linux_tests }}
      runs_windows_tests:         ${{ steps.flags.outputs.runs_windows_tests }}
      runs_e2e_tests:             ${{ steps.flags.outputs.runs_e2e_tests }}
      # A manual action, and nothing else, starts this one. Note the contrast with the `runs_*`
      # flags above, which an automatic run also sets.
      is_manual_windows_run:      ${{ steps.flags.outputs.is_manual_windows_run }}
      # The action itself. `discover` picks a matrix by name, so it needs the value, not a yes or no.
      manual_action:              ${{ steps.flags.outputs.manual_action }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { fetch-depth: 1, persist-credentials: false }
      - id: toolchains
        uses: ./.github/actions/resolve-toolchains-image
      - id: flags
        env:
          # Deliberately also true for epic/** refs — they get the same full matrices as master/develop.
          IS_FULL_MATRIX: ${{ github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/master' || contains(github.head_ref || github.ref_name, 'epic/') }}
          IS_RELEASE_BRANCH: ${{ github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/master' }}
          # The action the operator chose, and '' on every automatic run. Mind the second operand:
          # `A && B` yields the string "false" when A is false, so the `|| ''` is what makes an
          # automatic run empty rather than the word "false".
          MANUAL_ACTION: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.actionToPerform || '' }}
        run: |
          # A test family runs on every automatic run, and on a manual run only when the operator
          # asked for that family.
          runs_family() {
            if [ -z "$MANUAL_ACTION" ] || [ "$MANUAL_ACTION" = "$1" ]; then echo true; else echo false; fi
          }
          # A job that only a manual action may start. An automatic run must not match.
          chose() { if [ "$MANUAL_ACTION" = "$1" ]; then echo true; else echo false; fi; }
          {
            echo "is_full_matrix=$IS_FULL_MATRIX"
            echo "is_release_branch=$IS_RELEASE_BRANCH"
            echo "manual_action=$MANUAL_ACTION"
            echo "is_automatic_run=$([ -z "$MANUAL_ACTION" ] && echo true || echo false)"
            echo "runs_linux_tests=$(runs_family run_all_tests_on_linux)"
            echo "runs_windows_tests=$(runs_family run_all_tests_on_windows)"
            echo "runs_e2e_tests=$(runs_family run_e2e_tests)"
            echo "is_manual_windows_run=$(chose run_all_tests_on_windows)"
          } >> "$GITHUB_OUTPUT"

  # ── TOOLCHAINS_VERIFY ─────────────────────────────────────────────────────
  toolchains_verify:
    needs: ci_setup
    runs-on: ubuntu-latest   # free for public repos (4cpu/16GB); light job, speed barely matters
    # The runner pulls this image before step 1 runs, so ci/configure-docker.sh reaches neither the
    # mirror nor the login for it. The ci_setup job settles the name.
    # A mirrored name carries the digest, so every job of a run pulls the same bytes.
    #
    # The pull sends no credentials. A Docker Hub login against mirror.gcr.io fails, so the block
    # must be absent on the mirrored path. An empty value does not remove it. GitHub rejects it with
    # "Unexpected value ''" and stops the run before step 1. YAML cannot drop a key on a condition,
    # so the block is absent on both paths.
    #
    # Docker Hub then counts the fallback pull against the runner's address, not against our
    # account. The mirror serves the normal path.
    container: &toolchains_container
      image: ${{ needs.ci_setup.outputs.image }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { fetch-depth: 1, persist-credentials: false }
      - uses: ./.github/actions/verify-toolchains-image

  # ── DISCOVER ──────────────────────────────────────────────────────────────
  # What this run covers: the ES majors the release jobs build, and the modules each test family
  # tests. Both come from the modules that exist, through `printEsMajors` and `printTestMatrices`,
  # so a new module or a new major joins every matrix by itself. The rule is TestMatrixPolicy, and
  # ci/CI.md states it in prose.
  #
  # It emits one ready matrix per fan-out job, so a leg a run does not cover never boots a runner.
  discover:
    needs: [ ci_setup, toolchains_verify ]
    runs-on: ubuntu-latest   # free for public repos (4cpu/16GB); light job, speed barely matters
    container: *toolchains_container
    timeout-minutes: 10
    outputs:
      # One matrix per job that fans out, each ready for `strategy: matrix:`. An empty one skips its
      # job, so a family a run does not cover needs no condition of its own.
      build_matrix:      ${{ steps.matrices.outputs.build }}
      it_linux_matrix:   ${{ steps.matrices.outputs.linux }}
      it_windows_matrix: ${{ steps.matrices.outputs.windows }}
      e2e_matrix:        ${{ steps.matrices.outputs.e2e }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { fetch-depth: 1, persist-credentials: false }
      # One gradle call for both tasks. Each writes its answer to a file under build/. Gradle stdout
      # can carry configuration-time logging even under -q, so no step parses it.
      - name: Derive the ES majors and the test matrices
        run: ./gradlew --no-daemon -q printEsMajors printTestMatrices
      - id: matrices
        env:
          IS_FULL_MATRIX: ${{ needs.ci_setup.outputs.is_full_matrix }}
          IS_PR_DRAFT: ${{ github.event.pull_request.draft == true }}
          MANUAL_RUN_ACTION: ${{ needs.ci_setup.outputs.manual_action }}
          RUNS_LINUX_TESTS: ${{ needs.ci_setup.outputs.runs_linux_tests }}
          RUNS_WINDOWS_TESTS: ${{ needs.ci_setup.outputs.runs_windows_tests }}
          RUNS_E2E_TESTS: ${{ needs.ci_setup.outputs.runs_e2e_tests }}
        # Assign first, echo second. `echo "x=$(...)"` keeps the status of echo, so a missing matrix
        # would publish an empty one, skip every leg that reads it, and leave the run green.
        run: |
          set -e

          # The modules of one matrix, as the task wrote them: ["es94x", ...]
          read_modules() {
            local file=build/ci-matrices/$1.json
            [ -s "$file" ] || { echo "::error::printTestMatrices wrote no $1 matrix." >&2; return 1; }
            cat "$file"
          }

          # ["es94x", ...] -> {"include":[{"ES_MODULE":"es94x"}, ...]}, the matrix each leg reads.
          # The include form is the one whose empty case GitHub skips. A bare `KEY: []` is an error:
          # "Matrix vector 'KEY' does not contain any values".
          as_matrix() { jq -c --arg key "$1" '{include: map({($key): .})}' <<< "$2"; }

          # e2e_prepare runs once for all modules, not once per module. So its matrix holds one leg
          # that carries the whole list, and no leg at all when the list is empty. The empty matrix
          # is what skips the job, the same way it skips every other family.
          as_one_leg_matrix() {
            jq -c --arg key "$1" 'if length == 0 then { include: [] } else { include: [ { ($key): join(" ") } ] } end' <<< "$2"
          }

          MAJORS_FILE=build/es-modules/es-majors.txt
          # No major means no plugin gets built. That must fail, not pass quietly.
          [ -s "$MAJORS_FILE" ] || { echo "::error::printEsMajors wrote no ES major."; exit 1; }
          MAJORS=$(awk 'BEGIN { printf "[" } { printf "%s\"%s\"", (NR > 1 ? "," : ""), $0 } END { print "]" }' "$MAJORS_FILE")

          # An empty list is how a family is skipped. Each family starts from the question "does
          # this run cover it at all?", so a manual run of one family leaves the others empty.
          if [ "$RUNS_LINUX_TESTS" != "true" ]; then
            LINUX='[]'
          elif [ "$IS_PR_DRAFT" = "true" ]; then
            LINUX=$(read_modules linux_it_pr_draft)
          elif [ "$MANUAL_RUN_ACTION" = "run_all_tests_on_linux" ] || [ "$IS_FULL_MATRIX" = "true" ]; then
            LINUX=$(read_modules linux_it_full)
          else
            LINUX=$(read_modules linux_it_pr_ready)
          fi

          # A draft PR runs no Windows and no e2e leg at all.
          if [ "$RUNS_WINDOWS_TESTS" != "true" ] || [ "$IS_PR_DRAFT" = "true" ]; then
            WINDOWS='[]'
          elif [ "$MANUAL_RUN_ACTION" = "run_all_tests_on_windows" ]; then
            WINDOWS=$(read_modules win_it_full)
          elif [ "$IS_FULL_MATRIX" = "true" ]; then
            WINDOWS=$(read_modules win_it_master_or_develop)
          else
            WINDOWS=$(read_modules win_it_pr_ready)
          fi

          if [ "$RUNS_E2E_TESTS" != "true" ] || [ "$IS_PR_DRAFT" = "true" ]; then
            E2E='[]'
          else
            E2E=$(read_modules e2e_full)
          fi

          {
            echo "build=$(as_matrix ES_MAJOR "$MAJORS")"
            echo "linux=$(as_matrix ES_MODULE "$LINUX")"
            echo "windows=$(as_matrix ES_MODULE "$WINDOWS")"
            echo "e2e=$(as_one_leg_matrix ES_MODULES "$E2E")"
          } >> "$GITHUB_OUTPUT"

          {
            echo "ES majors: $MAJORS"
            echo "Linux IT: $LINUX"
            echo "Windows IT: $WINDOWS"
            echo "E2E: $E2E"
          } >> "$GITHUB_STEP_SUMMARY"

  # ── OPTIONAL_CHECKS: CVE (non-blocking) ───────────────────────────────────
  # Failures annotate the run but never block it. Matrix for symmetry with required_checks;
  # cve_check is currently its only member.
  optional_checks:
    needs: [ ci_setup, toolchains_verify ]
    # No status check function here, so the default still applies: every `needs` job must succeed.
    if: needs.ci_setup.outputs.is_automatic_run == 'true'
    runs-on: ubuntu-latest   # free for public repos (4cpu/16GB); light job, speed barely matters
    container: *toolchains_container
    continue-on-error: true
    # Without this limit, the job uses the GitHub default of 6 hours. dependency-check does not
    # treat a Sonatype 429 or 5xx as fatal. It sends the OSS Index request again for each
    # dependency. A Sonatype outage can thus use all 6 hours. A good run takes a few minutes.
    timeout-minutes: 30
    name: ${{ matrix.OPTIONAL_CHECK }}
    strategy:
      fail-fast: false
      matrix:
        OPTIONAL_CHECK: [ cve_check ]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { fetch-depth: 1, persist-credentials: false }
      - name: ${{ matrix.OPTIONAL_CHECK }}
        uses: ./.github/actions/cve-check
        with:
          # The caller decides who writes the NVD database cache. Pushes to develop and to master
          # occur often, and thus keep the cache fresh. A PR run only reads the cache.
          save-nvd-cache: >-
            ${{ github.event_name == 'push' &&
                needs.ci_setup.outputs.is_release_branch == 'true' }}
          nvd-api-key: ${{ secrets.NVD_API_KEY }}
          oss-index-username: ${{ secrets.OSS_INDEX_USERNAME }}
          oss-index-password: ${{ secrets.OSS_INDEX_PASSWORD }}

  # ── REQUIRED_CHECKS ───────────────────────────────────────────────────────
  required_checks:
    needs: [ ci_setup, toolchains_verify ]
    # No status check function here, so the default still applies: every `needs` job must succeed.
    if: needs.ci_setup.outputs.is_automatic_run == 'true'
    runs-on: ubuntu-latest   # free for public repos (4cpu/16GB); light job, speed barely matters
    container: *toolchains_container
    name: ${{ matrix.REQUIRED_CHECK }}
    strategy:
      fail-fast: false
      matrix:
        REQUIRED_CHECK: [ license_check, compile_codebase_check, audit_build_check, format_code_check ]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { fetch-depth: 1, persist-credentials: false }
      - name: ${{ matrix.REQUIRED_CHECK }}
        env:
          ROR_TASK: ${{ matrix.REQUIRED_CHECK }}
          ROR_S3_ENDPOINT_URL: ${{ vars.ROR_S3_ENDPOINT_URL }}
          ROR_S3_REGION: ${{ vars.ROR_S3_REGION }}
          ROR_S3_BUCKET: ${{ vars.ROR_S3_BUCKET }}
          ROR_S3_ACCESS_KEY_ID: ${{ secrets.ROR_S3_ACCESS_KEY_ID }}
          ROR_S3_SECRET_ACCESS_KEY: ${{ secrets.ROR_S3_SECRET_ACCESS_KEY }}
          ROR_S3_PATH_LIBS: ${{ vars.ROR_S3_PATH_LIBS }}
        run: ci/run-pipeline.sh

  # ── TEST: unit (Linux) ────────────────────────────────────────────────────
  unit_tests_linux:
    needs: [ ci_setup, toolchains_verify ]
    # No status check function here, so the default still applies: every `needs` job must succeed.
    if: needs.ci_setup.outputs.runs_linux_tests == 'true'
    runs-on: ubuntu-latest   # free for public repos (4cpu/16GB); light job, speed barely matters
    container: *toolchains_container
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { fetch-depth: 1, persist-credentials: false }
      - name: core_tests
        env:
          ROR_TASK: core_tests
          DOCKER_REGISTRY_USER: ${{ secrets.DOCKER_HUB_USER }}
          DOCKER_REGISTRY_PASSWORD: ${{ secrets.DOCKER_HUB_RO_TOKEN }}
        run: |
          source ci/configure-docker.sh
          ci/run-pipeline.sh
      - name: Publish test results
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: unit-test-results
          path: '**/TEST*.xml'
          if-no-files-found: ignore

  # ── TEST: Linux integration tests (Ubicloud) ──────────────────────────────
  # Matrix comes from discover: full 34-version set on develop/master/epic + manual run, the
  # 10-version representative subset on plain PRs.
  it_linux:
    needs: [ discover, ci_setup, toolchains_verify ]
    runs-on: ubicloud-standard-4
    container: *toolchains_container
    timeout-minutes: 120
    name: it_linux_${{ matrix.ES_MODULE }}
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.discover.outputs.it_linux_matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { fetch-depth: 1, persist-credentials: false }
      - name: Free host disk (no-op on self-hosted)
        run: ci/free-host-disk.sh
      - name: Start memory telemetry
        run: ci/mem-telemetry.sh start integration-tests/build/mem-telemetry-${{ matrix.ES_MODULE }}.log > "$RUNNER_TEMP/mem-telemetry.pid"
      - name: integration_${{ matrix.ES_MODULE }}
        env:
          # The pipeline task name run-pipeline.sh dispatches on — unchanged, only the matrix now
          # carries the bare module (see discover).
          ROR_TASK: integration_${{ matrix.ES_MODULE }}
          ROR_CI_JOB_ID: ${{ github.run_id }}-${{ strategy.job-index }}
          # Balanced (level) shard packing + the memory gate that makes it survivable on 16GB.
          # 2 permits, not 3: at k=4 with 3 permits the worst case (3 heavies x 3 nodes + a
          # single-node suite + 4 gradle JVMs) grazes 16GB and host-OOM'd es90x — and balanced
          # packing schedules the heaviest suites first, so that worst case happens at minute one.
          # es94x tolerated 3 only because it excludes some of the heavy suites other modules run.
          ROR_BALANCED_SHARDS: 'true'
          ROR_HEAVY_SUITE_PERMITS: '2'
          # the JDWP agent costs ~90MB RSS per ES container and nothing attaches to it in CI
          ROR_ES_JDWP: 'false'
          ROR_S3_ENDPOINT_URL: ${{ vars.ROR_S3_ENDPOINT_URL }}
          ROR_S3_REGION: ${{ vars.ROR_S3_REGION }}
          ROR_S3_BUCKET: ${{ vars.ROR_S3_BUCKET }}
          ROR_S3_ACCESS_KEY_ID: ${{ secrets.ROR_S3_ACCESS_KEY_ID }}
          ROR_S3_SECRET_ACCESS_KEY: ${{ secrets.ROR_S3_SECRET_ACCESS_KEY }}
          ROR_S3_PATH_LIBS: ${{ vars.ROR_S3_PATH_LIBS }}
          DOCKER_REGISTRY_USER: ${{ secrets.DOCKER_HUB_USER }}
          DOCKER_REGISTRY_PASSWORD: ${{ secrets.DOCKER_HUB_RO_TOKEN }}
        run: |
          source ci/configure-docker.sh
          ci/run-pipeline.sh
      - name: Publish test results
        # always(): green-run XMLs feed suite-timings.json regeneration (duration-balanced sharding)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: it-linux-${{ matrix.ES_MODULE }}-results
          path: '**/TEST*.xml'
          if-no-files-found: ignore
      # Shard stdout goes to shard-<i>.log files during the run (live interleaving would be
      # unreadable); print them afterwards as collapsible groups so they are browsable in the UI.
      - name: Shard logs (browsable)
        if: always()
        run: |
          for f in integration-tests/build/sharded-logs/shard-*.log; do
            [ -f "$f" ] || continue
            echo "::group::$(basename "$f")"
            cat "$f"
            echo "::endgroup::"
          done
      - name: Memory telemetry report
        if: always()
        env:
          ROR_CI_JOB_ID: ${{ github.run_id }}-${{ strategy.job-index }}
        run: |
          [ -f "$RUNNER_TEMP/mem-telemetry.pid" ] && ci/mem-telemetry.sh stop "$(cat "$RUNNER_TEMP/mem-telemetry.pid")" || true
          for f in integration-tests/build/mem-telemetry-*.log; do
            [ -f "$f" ] || continue
            echo "::group::$(basename "$f") report"
            ci/mem-telemetry.sh report "$f"
            echo "::endgroup::"
          done
      - name: Publish memory telemetry
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mem-telemetry-${{ matrix.ES_MODULE }}
          path: integration-tests/build/mem-telemetry-*.log
          if-no-files-found: ignore
      # Drift guard for duration-balanced sharding: warns when measured suite times diverge from
      # the committed suite-timings.json and uploads a regenerated file (regeneration = download
      # the artifact, commit it). One leg only — es90x (the first ES 9 module: a stable reference
      # that never moves when a newer es9Xx module is added).
      - name: Suite-timings drift check
        if: always() && matrix.ES_MODULE == 'es90x'
        run: ./gradlew integration-tests:regenerateSuiteTimings || true
      - name: Publish regenerated suite timings
        if: always() && matrix.ES_MODULE == 'es90x'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: suite-timings-regenerated
          path: integration-tests/build/suite-timings-regenerated.json
          if-no-files-found: ignore
      - name: Publish per-shard logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sharded-logs-it-linux-${{ matrix.ES_MODULE }}
          path: integration-tests/build/sharded-logs/
          if-no-files-found: ignore


  # ── TEST: Windows integration tests (GitHub-hosted) ───────────────────────
  # Matrix from discover: 6-version subset on develop/master/epic, 3 on ready PRs, none on draft
  # PRs (job skipped), full 33 on manual run_all_tests_on_windows.
  it_windows:
    # toolchains_verify is in needs even though Windows doesn't use the image, so a broken image
    # fails fast instead of running doomed legs.
    needs: [ discover, toolchains_verify ]
    runs-on: windows-2025
    timeout-minutes: 150
    # Clear the Linux toolchains-image Gradle settings at job scope; the workflow-level
    # GRADLE_USER_HOME=/opt/gradle-home would otherwise leak into gradlew here.
    env:
      GRADLE_USER_HOME: ''
      GRADLE_OPTS: ''
    # "it_win_es94x", not the truncated "it_windows (es94x)" composite, in the graph view. Same
    # <leg>_<module> shape as it_linux_* and e2e_*, so the three test families sort together.
    name: it_win_${{ matrix.ES_MODULE }}
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix: ${{ fromJSON(needs.discover.outputs.it_windows_matrix) }}
    steps:
      - name: Exclude workspace from Windows Defender
        shell: pwsh
        # Real-time AV scanning taxes every file write; our tests write hundreds of thousands
        # (ES unzips, node data dirs). Standard CI mitigation; runner VMs are ephemeral.
        run: |
          Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE"
          Add-MpPreference -ExclusionPath "$env:RUNNER_TEMP"
          Add-MpPreference -ExclusionProcess "java.exe"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { fetch-depth: 1, persist-credentials: false }
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with: { distribution: temurin, java-version: '21' }
      # Windows has no baked toolchains image: without this every leg cold-downloads the wrapper,
      # deps + JDKs and cold-compiles Scala (~9 min). Develop runs write the cache; PRs read it.
      # jdks: not in the action's default include set, but auto-download=true provisions there.
      - uses: gradle/actions/setup-gradle@da187c8e6ffbd3802e00f2477aa5a822b25f2dda
        with:
          gradle-home-cache-includes: |
            caches
            notifications
            jdks
      - name: ${{ matrix.ES_MODULE }}
        shell: pwsh
        env:
          ROR_S3_ENDPOINT_URL: ${{ vars.ROR_S3_ENDPOINT_URL }}
          ROR_S3_REGION: ${{ vars.ROR_S3_REGION }}
          ROR_S3_BUCKET: ${{ vars.ROR_S3_BUCKET }}
          ROR_S3_ACCESS_KEY_ID: ${{ secrets.ROR_S3_ACCESS_KEY_ID }}
          ROR_S3_SECRET_ACCESS_KEY: ${{ secrets.ROR_S3_SECRET_ACCESS_KEY }}
          ROR_S3_PATH_LIBS: ${{ vars.ROR_S3_PATH_LIBS }}
          ES_MODULE: ${{ matrix.ES_MODULE }}
          # level packing (the random split gave 15/29/23 suites) + memory gate for native-ES spikes
          ROR_BALANCED_SHARDS: 'true'
          ROR_HEAVY_SUITE_PERMITS: '2'
        run: |
          # Override the Linux gradle.properties installations.paths and let Windows auto-provision JDKs.
          # Sharded (3 workers) — same trick as the Linux legs; ES runs as native processes on
          # Windows (no docker), 3 fit the 16GB box. 4 workers measured no faster (CPU-bound).
          # ror-tools:test is NOT run per-leg: it took ~10 min/leg and every node install already
          # exercises the patcher end-to-end; the suite still runs via unit_tests_windows.
          # Cap the orchestrator heap for the same reason as the Linux legs (RORDEV-2156): it only
          # spawns the shard processes, but without this it inherits gradle.properties' -Xmx6144m,
          # on a 16GB box that already holds 3 shard JVMs, 3 test workers and 3 native ES nodes.
          $gradleArgs = "--no-daemon", "--build-cache", "integration-tests:shardedTest", "-PshardCount=3", "-PesModule=$env:ES_MODULE",
            "-Dorg.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m",
            "-Dorg.gradle.java.installations.paths=", "-Dorg.gradle.java.installations.auto-download=true"
          .\gradlew @gradleArgs
          if ($LASTEXITCODE -ne 0) {
            Get-ChildItem -Recurse -Filter *hs_err* | ForEach-Object { Get-Content $_.FullName }
            exit 1
          }
      - name: Publish test results
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: it-win-${{ matrix.ES_MODULE }}-results
          path: '**/TEST*.xml'
          if-no-files-found: ignore
      - name: Shard logs (browsable)
        if: always()
        shell: pwsh
        run: |
          Get-ChildItem integration-tests/build/sharded-logs -Filter shard-*.log -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Output "::group::$($_.Name)"
            Get-Content $_.FullName
            Write-Output "::endgroup::"
          }
      - name: Publish per-shard logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sharded-logs-it-win-${{ matrix.ES_MODULE }}
          path: integration-tests/build/sharded-logs/
          if-no-files-found: ignore


  # ── TEST: unit tests on Windows (manual run_all_tests_on_windows only) ────
  unit_tests_windows:
    # ci_setup is in needs only to read its flags; this job uses no toolchains image.
    needs: ci_setup
    if: >-
      needs.ci_setup.outputs.is_manual_windows_run == 'true'
    runs-on: windows-2025
    timeout-minutes: 150
    env:
      GRADLE_USER_HOME: ''
      GRADLE_OPTS: ''
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { fetch-depth: 1, persist-credentials: false }
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with: { distribution: temurin, java-version: '21' }
      - name: core:test on Windows
        shell: pwsh
        run: |
          .\gradlew --no-daemon core:test ror-tools:test "-PesModule=es94x" `
            "-Dorg.gradle.java.installations.paths=" `
            "-Dorg.gradle.java.installations.auto-download=true"
          if ($LASTEXITCODE -ne 0) {
            Get-ChildItem -Recurse -Filter *hs_err* | ForEach-Object { Get-Content $_.FullName }
            exit 1
          }
      - name: Publish test results
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: win-unit-test-results
          path: '**/TEST*.xml'
          if-no-files-found: ignore

  # ── E2E_PREPARE (setup for the e2e matrix) ────────────────────────────────
  # Takes the newest ES version of every ES module picked for e2e, and starts ONE build of the ROR
  # KBN dev image for all of them. Outputs those versions as the matrix the e2e_tests jobs run on,
  # plus the build's run id so they know which build to wait for.
  e2e_prepare:
    needs: [ discover, ci_setup, toolchains_verify ]
    runs-on: ubuntu-latest
    container: *toolchains_container
    timeout-minutes: 30
    # One leg, holding every module of the e2e matrix. A run that covers no e2e module gets no leg,
    # and the job is skipped. The name must stay "e2e_prepare": a matrix would otherwise put the leg
    # in it, and a renamed required check stops gating.
    name: e2e_prepare
    strategy:
      matrix: ${{ fromJSON(needs.discover.outputs.e2e_matrix) }}
    outputs:
      matrix: ${{ steps.prepare.outputs.matrix }}
      build_id: ${{ steps.prepare.outputs.build_id }}
      kbn_run_id: ${{ steps.prepare.outputs.kbn_run_id }}
      kbn_run_url: ${{ steps.prepare.outputs.kbn_run_url }}
      kbn_wait_timeout_seconds: ${{ steps.prepare.outputs.kbn_wait_timeout_seconds }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { fetch-depth: 1, persist-credentials: false }
      - name: prepare_e2e_kbn_images
        id: prepare
        env:
          ROR_TASK: prepare_e2e_kbn_images
          E2E_ES_MODULES: ${{ matrix.ES_MODULES }}
          ROR_KBN_TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
          ROR_KBN_FALLBACK_BRANCH: ${{ github.base_ref || github.ref_name }}
          E2E_BUILD_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          ROR_GH_TOKEN: ${{ secrets.ROR_GH_TOKEN }}
        run: ci/run-pipeline.sh

  # ── E2E_TESTS (docker env) ────────────────────────────────────────────────
  # Cypress e2e suite (one job per module). Each job builds and publishes the ROR ES image for its
  # version, waits for the ROR KBN image, then runs the test suite against both (see ci/e2e-tests-lib.sh).
  e2e_tests:
    needs: [ toolchains_verify, e2e_prepare ]
    runs-on: ubicloud-standard-4
    timeout-minutes: 120
    env:
      GRADLE_USER_HOME: ${{ github.workspace }}/.gradle-home
      GRADLE_OPTS: '-Dorg.gradle.java.installations.paths= -Dorg.gradle.java.installations.auto-download=true'
    name: e2e_${{ matrix.module }}
    strategy:
      fail-fast: false
      max-parallel: 99
      matrix: ${{ fromJSON(needs.e2e_prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { fetch-depth: 1, persist-credentials: false }
      - name: Free host disk (no-op on self-hosted)
        run: ci/free-host-disk.sh
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with: { distribution: temurin, java-version: '17' }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: '24.11.0' }
      - name: run_e2e_tests
        env:
          ROR_TASK: run_e2e_tests
          E2E_ES_MODULE: ${{ matrix.module }}
          E2E_ELK_VERSION: ${{ matrix.elk }}
          E2E_TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
          E2E_FALLBACK_BRANCH: ${{ github.base_ref || github.ref_name }}
          E2E_BUILD_ID: ${{ needs.e2e_prepare.outputs.build_id }}
          ROR_KBN_PREBUILD_RUN_ID: ${{ needs.e2e_prepare.outputs.kbn_run_id }}
          ROR_KBN_PREBUILD_RUN_URL: ${{ needs.e2e_prepare.outputs.kbn_run_url }}
          ROR_KBN_WAIT_TIMEOUT_SECONDS: ${{ needs.e2e_prepare.outputs.kbn_wait_timeout_seconds }}
          ROR_ACTIVATION_KEY: ${{ secrets.ROR_ENT_ACTIVATION_TOKEN }}
          ROR_GH_TOKEN: ${{ secrets.ROR_GH_TOKEN }}
          DOCKER_REGISTRY_USER: ${{ secrets.DOCKER_HUB_USER }}
          DOCKER_REGISTRY_PASSWORD: ${{ secrets.DOCKER_HUB_RW_TOKEN }}
          # Do not let corepack ask before it downloads yarn. CI has no operator.
          COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
        run: |
          set -e
           # The e2e repo pins yarn in "packageManager". Corepack reads and uses that.
          corepack enable
          source ci/configure-docker.sh
          echo "[E2E_TESTS] executing ROR_TASK = $ROR_TASK for module $E2E_ES_MODULE (ELK $E2E_ELK_VERSION)"
          ci/run-pipeline.sh

      # Upload test videos/screenshots to S3 (not GitHub artifacts, to save the Actions quota).
      # E2E_TESTS_DIR is set by run_e2e_tests.
      - name: Upload Cypress artifacts to S3 on failure
        if: failure()
        continue-on-error: true
        # One S3 credential set serves every store; only the path prefix differs per store.
        env:
          ROR_S3_ENDPOINT_URL: ${{ vars.ROR_S3_ENDPOINT_URL }}
          ROR_S3_REGION: ${{ vars.ROR_S3_REGION }}
          ROR_S3_BUCKET: ${{ vars.ROR_S3_BUCKET }}
          ROR_S3_ACCESS_KEY_ID: ${{ secrets.ROR_S3_ACCESS_KEY_ID }}
          ROR_S3_SECRET_ACCESS_KEY: ${{ secrets.ROR_S3_SECRET_ACCESS_KEY }}
          ROR_S3_PATH_E2E_REPORTS: ${{ vars.ROR_S3_PATH_E2E_REPORTS }}
        run: |
          set -e
          # Path layout: <PATH_PREFIX>/YYYY-MM-DD/build_<run id>/<module>_<elk>/<videos|screenshots>
          # Do not hardcode PATH_PREFIX — it is already set. The date sorts reports chronologically.
          BASE="${ROR_S3_PATH_E2E_REPORTS:+${ROR_S3_PATH_E2E_REPORTS%/}/}"
          export ROR_S3_PATH_E2E_REPORTS="${BASE}$(date -u +%Y-%m-%d)/build_${{ github.run_id }}"
          ci/upload-cypress-artifacts-to-s3.sh \
            "${E2E_TESTS_DIR:?run_e2e_tests did not publish the e2e clone path}/results" \
            "${{ matrix.module }}_${{ matrix.elk }}"

  # ── BUILD_ROR (PR only) ───────────────────────────────────────────────────
  # it_windows / e2e_tests may legitimately not run: a draft PR gets an empty matrix for both, and an
  # empty matrix skips the job. e2e is tolerated on a skipped e2e_prepare, not on a skipped
  # e2e_tests. A FAILED e2e_prepare also leaves e2e_tests 'skipped', and that must still block.
  build_ror:
    needs: [ ci_setup, discover, required_checks, unit_tests_linux, it_linux, it_windows, e2e_prepare, e2e_tests ]
    if: >-
      !cancelled() &&
      github.event_name == 'pull_request' &&
      needs.required_checks.result == 'success' &&
      needs.unit_tests_linux.result == 'success' &&
      needs.it_linux.result == 'success' &&
      (needs.it_windows.result == 'success' || needs.it_windows.result == 'skipped') &&
      (needs.e2e_tests.result == 'success' || needs.e2e_prepare.result == 'skipped')
    runs-on: ubicloud-standard-4
    container: *toolchains_container
    timeout-minutes: 180
    # discover supplies the majors, so a new major needs no edit here. The name must stay
    # what it renders today ("build_es9xx"). These are required checks. A renamed check stops gating.
    name: build_es${{ matrix.ES_MAJOR }}xx
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.build_matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { fetch-depth: 1, persist-credentials: false }
      - name: build_plugins
        env:
          ROR_TASK: build_plugins
          ES_MAJOR: ${{ matrix.ES_MAJOR }}
        run: ci/run-pipeline.sh
