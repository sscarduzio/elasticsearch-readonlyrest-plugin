# es94x spans ES 9.4.0-9.5.0; ES 9.5 added default methods to RestHandler (supportsReadOnlyFormEncodedPostBody)
# and RestInterceptor (allowsBrowserSafelistedContentType), and Scala emits a mixin forwarder for every inherited
# default method, so ROR's 9.4-compiled decorators lack the two forwarders a 9.5 build carries.
# Base per minor: 9.4.x repackages from 9.4.0, 9.5.x from 9.5.0.
baseEsVersions=9.4.0,9.5.0

supportedEsVersions=\
  9.4.0,\
  9.4.1,\
  9.4.2, \
  9.4.3, \
  9.4.4, \
  9.4.5, \
  9.5.0, \
  9.5.1
