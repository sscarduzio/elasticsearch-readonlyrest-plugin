# Release steps shared by the RELEASE_ROR (auto, post-test) and RELEASE_ROR_WITHOUT_TESTING
# (manual, skip-test) stages. The matrix that fans out per ES major (ROR_TASK=release_esNxx)
# lives in each stage's `strategy`; these steps consume $ROR_TASK.
parameters:
  - name: phase
    type: string
    default: 'RELEASE_ROR'

steps:
  - checkout: self
    fetchDepth: 1
    clean: false
    persistCredentials: true
    timeoutInMinutes: 300
  - script: |
      set -e

      export ROR_S3_ENDPOINT_URL=$VAR_ROR_S3_ENDPOINT_URL
      export ROR_S3_REGION=$VAR_ROR_S3_REGION
      export ROR_S3_BUCKET=$VAR_ROR_S3_BUCKET
      export ROR_S3_ACCESS_KEY_ID=$VAR_ROR_S3_ACCESS_KEY_ID
      export ROR_S3_SECRET_ACCESS_KEY=$VAR_ROR_S3_SECRET_ACCESS_KEY
      export ROR_S3_PATH_ARTIFACTS=$VAR_ROR_S3_PATH_ARTIFACTS
      export ROR_S3_PATH_LIBS=$VAR_ROR_S3_PATH_LIBS

      if ! docker login -u $var_docker_hub_user -p $var_docker_hub_rw_token; then
        echo "Error: Failed to login to Docker registry"
        exit 1
      fi

      echo "[${{ parameters.phase }}] executing ROR_TASK = $ROR_TASK"
      echo ">>> ($ROR_TASK) Releasing ROR" && ci/run-pipeline.sh
    env:
      VAR_ROR_S3_ENDPOINT_URL: $(ROR_S3_ENDPOINT_URL)
      VAR_ROR_S3_REGION: $(ROR_S3_REGION)
      VAR_ROR_S3_BUCKET: $(ROR_S3_BUCKET)
      VAR_ROR_S3_ACCESS_KEY_ID: $(ROR_S3_ACCESS_KEY_ID)
      VAR_ROR_S3_SECRET_ACCESS_KEY: $(ROR_S3_SECRET_ACCESS_KEY)
      VAR_ROR_S3_PATH_ARTIFACTS: $(ROR_S3_PATH_ARTIFACTS)
      VAR_ROR_S3_PATH_LIBS: $(ROR_S3_PATH_LIBS)
      var_docker_hub_user: $(DOCKER_HUB_USER)
      var_docker_hub_rw_token: $(DOCKER_HUB_RW_TOKEN)
      GRADLE_USER_HOME: $(GRADLE_USER_HOME)
