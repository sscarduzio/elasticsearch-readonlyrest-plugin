# Release steps shared by the RELEASE_ROR (auto, post-test) and RELEASE_ROR_WITHOUT_TESTING
# (manual, skip-test) stages. The matrix that fans out per ES major (ROR_TASK=release_esNxx)
# lives in each stage's `strategy`; these steps consume $ROR_TASK.
parameters:
  - name: phase
    type: string
    default: 'RELEASE_ROR'

steps:
  - checkout: self
    fetchDepth: 1
    clean: false
    persistCredentials: true
    timeoutInMinutes: 300
  - script: |
      set -e

      export ROR_S3_ENDPOINT_URL=$VAR_ROR_S3_ENDPOINT_URL
      export ROR_S3_REGION=$VAR_ROR_S3_REGION
      export ROR_S3_BUCKET=$VAR_ROR_S3_BUCKET
      export ROR_S3_ACCESS_KEY_ID=$VAR_ROR_S3_ACCESS_KEY_ID
      export ROR_S3_SECRET_ACCESS_KEY=$VAR_ROR_S3_SECRET_ACCESS_KEY
      export ROR_S3_PATH_ARTIFACTS=$VAR_ROR_S3_PATH_ARTIFACTS
      export ROR_S3_PATH_LIBS=$VAR_ROR_S3_PATH_LIBS

      if ! docker login -u $var_docker_hub_user -p $var_docker_hub_rw_token; then
        echo "Error: Failed to login to Docker registry"
        exit 1
      fi

      echo "[${{ parameters.phase }}] executing ROR_TASK = $ROR_TASK"
      echo ">>> ($ROR_TASK) Releasing ROR" && ci/run-pipeline.sh
    env:
      # The right-hand names are the OLD variables, and they are deliberate: this Azure pipeline still
      # defines only the pre-#1348 names (ROR_*_STORE_*, DOCKER_REGISTRY_PASSWORD). Azure leaves
      # $(NAME) literal when a variable does not exist, so the new names reach the scripts as macro
      # text. Azure gives way to GitHub Actions soon, so map here instead of renaming in Azure.
      VAR_ROR_S3_ENDPOINT_URL: $(ROR_LIBS_STORE_ENDPOINT_URL)
      VAR_ROR_S3_REGION: $(ROR_LIBS_STORE_REGION)
      VAR_ROR_S3_BUCKET: $(ROR_LIBS_STORE_BUCKET)
      VAR_ROR_S3_ACCESS_KEY_ID: $(ROR_ARTIFACTS_STORE_ACCESS_KEY_ID)
      VAR_ROR_S3_SECRET_ACCESS_KEY: $(ROR_ARTIFACTS_STORE_ACCESS_KEY_SECRET)
      VAR_ROR_S3_PATH_ARTIFACTS: $(ROR_ARTIFACTS_STORE_PATH_PREFIX)
      VAR_ROR_S3_PATH_LIBS: $(ROR_LIBS_STORE_PATH_PREFIX)
      var_docker_hub_user: $(DOCKER_HUB_USER)
      var_docker_hub_rw_token: $(DOCKER_REGISTRY_PASSWORD)
      GRADLE_USER_HOME: $(GRADLE_USER_HOME)
