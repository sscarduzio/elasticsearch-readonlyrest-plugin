steps:
  - bash: |
      ids=$(docker ps -aq --filter "label=ror.ci-job=$ROR_CI_JOB_ID" 2>/dev/null)
      [ -n "$ids" ] && docker rm -f $ids || true
      docker image prune -af --filter "until=180m" >/dev/null 2>&1 || true
      docker image prune -f >/dev/null 2>&1 || true
      docker builder prune -f >/dev/null 2>&1 || true
    displayName: 'Pre-clean this CI job''s Docker leftovers (shared-daemon safe)'
    env:
      ROR_CI_JOB_ID: $(Build.BuildId)-$(System.JobId)
      AGENT_ISSELFHOSTED: $(Agent.IsSelfHosted)

  - checkout: self
    fetchDepth: 1
    clean: false
    persistCredentials: true
  # No ROR_S3_* here: these tests only READ the ES libs, and Gradle's default public store
  # (readonlyrest.plugin-common-conventions.gradle) already serves them. Passing the vars in is a
  # hazard - Azure leaves `$(NAME)` literal when the pipeline variable is undefined, and Gradle then
  # builds a nonsense repository URL that fails to resolve.
  - script: |
      # Sourced in-process so DOCKER_AUTH_CONFIG (when set) reaches the testcontainers JVM, and
      # stays UNSET otherwise (a cross-step Azure var can't express "absent", only ""/literal — both
      # of which testcontainers' RegistryAuthLocator would fail to JSON-parse).
      source ci/docker-hub-auth.sh

      echo "[TEST] executing ROR_TASK = $ROR_TASK"
      ci/run-pipeline.sh
    env:
      GRADLE_USER_HOME: $(GRADLE_USER_HOME)
      DOCKER_HUB_USER: $(DOCKER_HUB_USER)
      DOCKER_HUB_RO_TOKEN: $(DOCKER_HUB_RO_TOKEN)

  - task: PublishTestResults@2
    condition: failed()
    inputs:
      testRunTitle: "$(ROR_TASK) results"
      testResultsFiles: "**/TEST*xml"
      mergeTestResults: true

  # Publish per-shard logs so they're downloadable from the Azure build page (not garbled in the
  # console stream when shardCount > 1). Each shard writes to build/sharded-logs/shard-<i>.log.
  # Guard: sharded-logs/ only exists if shardedTest actually spawned processes — skip on early exit.
  - bash: |
      d="$(Build.SourcesDirectory)/integration-tests/build/sharded-logs"
      if [ -d "$d" ] && [ "$(ls -A "$d" 2>/dev/null)" ]; then
        echo "##vso[task.setvariable variable=SHARDED_LOGS_DIR]$d"
      fi
    displayName: 'Check sharded-logs exists'
    condition: always()
  - task: PublishBuildArtifacts@1
    condition: and(always(), ne(variables['SHARDED_LOGS_DIR'], ''))
    inputs:
      PathtoPublish: "$(SHARDED_LOGS_DIR)"
      ArtifactName: sharded-logs
      publishLocation: Container
    displayName: 'Publish per-shard test logs'

  # Reap THIS CI job's containers however the job ended (always() runs in the cancel grace period);
  # the Abandoned case is covered by the host timer. Scoped by label -> never touches a sibling CI job.
  - bash: |
      echo ">>> reaping THIS CI job's containers ($ROR_CI_JOB_ID) on exit"
      source ci/ci-lib.sh && reap_ci_job_containers   # single source of truth (ci-lib.sh)
    displayName: 'Reap this CI job''s containers (always)'
    condition: always()
    env:
      ROR_CI_JOB_ID: $(Build.BuildId)-$(System.JobId)
